<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>Alistamiento Dislicores</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --pr:#1a1a1a;--pr-d:#000000;--pr-l:#f5f0e8;
  --gold:#c9a84c;--gold-d:#a8873a;--gold-l:#fdf6e3;
  --ok:#16a34a;--ok-l:#f0fdf4;
  --wa:#d97706;--wa-l:#fffbeb;
  --er:#dc2626;--er-l:#fef2f2;
  --bg:#fafaf7;--surf:#ffffff;--bord:#e8e0d0;
  --txt:#1a1a1a;--mut:#6b6b6b;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}
.app{max-width:520px;margin:0 auto;padding-bottom:80px}
/* Header */
.hdr{background:var(--pr);color:#fff;padding:13px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100;box-shadow:0 3px 0 var(--gold),0 4px 12px rgba(0,0,0,.4)}
.hdr h1{font-size:16px;font-weight:700;flex:1}
.hdr-sub{font-size:11px;opacity:.8}
.hdr-btn{background:rgba(255,255,255,.2);border:none;color:#fff;padding:6px 10px;border-radius:8px;font-size:12px;cursor:pointer;white-space:nowrap}
/* Cards */
.card{background:var(--surf);border-radius:14px;padding:16px;margin:10px 14px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;border:none;transition:all .15s;width:100%;margin-top:8px}
.btn-pr{background:var(--pr);color:var(--gold)}.btn-pr:active{background:var(--pr-d)}
.btn-ok{background:var(--ok);color:#fff}
.btn-er{background:var(--er);color:#fff}
.btn-sec{background:#f3f4f6;color:var(--txt)}
.btn-wa{background:var(--wa);color:#fff}
.btn-sm{padding:6px 12px;font-size:12px;width:auto;margin-top:0}
.file-btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:11px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;color:#fff;width:100%;margin-top:8px}
.file-btn input{display:none}
/* Loader */
#loader{position:fixed;inset:0;background:rgba(255,255,255,.92);z-index:999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.spin{width:40px;height:40px;border:4px solid var(--bord);border-top-color:var(--pr);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* Toast */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:12px 22px;border-radius:12px;font-size:14px;font-weight:600;color:#fff;z-index:1001;display:none;max-width:380px;text-align:center;box-shadow:0 4px 16px rgba(0,0,0,.25);line-height:1.4}
/* List items */
.list-item{display:flex;align-items:center;gap:12px;background:var(--surf);border-radius:12px;padding:14px;margin:7px 14px;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.06);transition:background .1s}
.list-item:active{background:var(--pr-l)}
.li-icon{font-size:24px;min-width:32px;text-align:center}
.li-body{flex:1;min-width:0}
.li-name{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li-sub{font-size:12px;color:var(--mut);margin-top:2px}
.li-arr{color:var(--mut);font-size:20px}
/* Badges */
.badge{display:inline-flex;align-items:center;font-size:11px;padding:2px 8px;border-radius:20px;font-weight:600;white-space:nowrap}
.b-pr{background:var(--gold);color:#1a1a1a;font-weight:700}
.b-ok{background:var(--ok);color:#fff}
.b-wa{background:var(--wa);color:#fff}
.b-er{background:var(--er);color:#fff}
.b-gray{background:#e5e7eb;color:var(--txt)}
.b-vio{background:#7c3aed;color:#fff}
/* Progress */
.prog-bg{background:var(--bord);border-radius:4px;height:7px;overflow:hidden;margin:5px 0}
.prog-fill{background:var(--gold);height:100%;border-radius:4px;transition:width .3s}
/* Modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:none;align-items:flex-end;justify-content:center}
.modal{background:var(--surf);border-radius:20px 20px 0 0;padding:20px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto}
.modal-hdl{width:36px;height:4px;background:var(--bord);border-radius:2px;margin:0 auto 14px}
/* Input */
.inp{width:100%;padding:11px 14px;border:2px solid var(--bord);border-radius:10px;font-size:15px;margin:5px 0;outline:none;transition:border-color .15s;background:#fff}
.inp:focus{border-color:var(--gold)}
.inp-label{font-size:12px;font-weight:600;color:var(--mut);margin-top:8px;display:block}
/* Table */
.tbl-wrap{overflow-x:auto;margin-top:8px;border-radius:10px;border:1px solid var(--bord)}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{background:var(--pr);color:var(--gold);padding:8px 10px;text-align:left;font-size:11px;white-space:nowrap;position:sticky;top:0}
.tbl td{padding:7px 10px;border-bottom:1px solid var(--bord);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:nth-child(even) td{background:#fafafa}
.tbl tr:hover td{background:var(--pr-l)}
.edit-inp{width:100%;padding:3px 6px;border:1px solid var(--bord);border-radius:4px;font-size:12px;outline:none;background:#fff}
.edit-inp:focus{border-color:var(--gold)}
/* Toggle */
.tog{position:relative;display:inline-block;width:40px;height:22px}
.tog input{opacity:0;width:0;height:0}
.tog-sl{position:absolute;cursor:pointer;inset:0;background:#ccc;border-radius:22px;transition:.3s}
.tog-sl:before{content:"";position:absolute;width:16px;height:16px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.3s}
input:checked+.tog-sl{background:var(--pr)}
input:checked+.tog-sl:before{transform:translateX(18px)}
/* Tabs */
.tabs{display:flex;background:var(--surf);border-bottom:2px solid var(--bord);position:sticky;top:50px;z-index:90}
.tab{flex:1;padding:10px 6px;text-align:center;font-size:12px;font-weight:600;cursor:pointer;color:var(--mut);transition:all .15s}
.tab.on{color:var(--pr);border-bottom:2px solid var(--pr);margin-bottom:-2px}
/* Item card alistamiento */
.item-card{background:var(--surf);margin:6px 12px;border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.07)}
.item-card.done{opacity:.6}
.ic-main{padding:12px;cursor:pointer}
.ic-ref{font-size:11px;color:var(--mut);font-weight:600}
.ic-desc{font-size:14px;font-weight:700;margin:2px 0 6px}
.ic-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ic-bar{height:4px;transition:width .3s}
/* Kit breakdown */
.kit-box{background:#fdf4ff;border:1px solid #d8b4fe;border-radius:8px;padding:8px 10px;margin:6px 0 2px;font-size:12px}
.kit-row{display:flex;justify-content:space-between;padding:2px 0;color:#6d28d9}
/* Filter bar */
.filter-bar{display:flex;gap:8px;padding:8px 14px;background:var(--surf);border-bottom:1px solid var(--bord);overflow-x:auto}
.filter-bar input,.filter-bar select{padding:6px 10px;border:1px solid var(--bord);border-radius:8px;font-size:12px;outline:none;min-width:120px;background:#fff}
.filter-bar input:focus,.filter-bar select:focus{border-color:var(--pr)}
/* Summary */
.sum-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--bord);font-size:13px}
/* FAB */
.fab{position:fixed;bottom:20px;right:20px;width:52px;height:52px;border-radius:50%;background:var(--pr);color:#fff;font-size:22px;display:none;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 14px rgba(109,40,217,.4);z-index:150;border:none}
/* Role cards */
.role-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:12px}
.role-card{background:var(--surf);border:2px solid var(--bord);border-radius:14px;padding:14px 8px;text-align:center;cursor:pointer;transition:all .15s}
.role-card:active,.role-card.sel{border-color:var(--gold);background:var(--gold-l)}
.role-ico{font-size:28px;margin-bottom:5px}
.role-lbl{font-size:12px;font-weight:700}
/* Stat boxes */
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 14px}
.stat-box{background:var(--surf);border-radius:12px;padding:12px 8px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.stat-n{font-size:22px;font-weight:800}
.stat-l{font-size:11px;color:var(--mut);margin-top:2px}
/* Dashboard */
.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 14px}
.dash-card{background:var(--surf);border-radius:14px;padding:14px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.dash-card-full{background:var(--surf);border-radius:14px;padding:14px;margin:0 14px 10px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.dash-title{font-size:12px;font-weight:700;color:var(--mut);margin-bottom:10px;text-transform:uppercase}
.dash-big{font-size:36px;font-weight:900;color:var(--gold)}
.dash-sub{font-size:12px;color:var(--mut)}
/* Barra zona dashboard */
.zona-bar{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--bord)}
.zona-bar-name{font-size:12px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zona-bar-pct{font-size:11px;color:var(--mut);min-width:30px;text-align:right}
.zona-bar-bg{flex:2;background:var(--bord);border-radius:4px;height:6px;overflow:hidden}
.zona-bar-fill{height:100%;border-radius:4px;background:var(--gold);transition:width .4s}
/* Alistador en vivo */
.live-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--bord)}
.live-dot{width:10px;height:10px;border-radius:50%;background:var(--ok);flex-shrink:0;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.live-name{font-weight:700;font-size:13px;flex:1}
.live-zona{font-size:11px;color:var(--mut)}
/* Timer */
.timer-box{background:var(--pr);color:var(--gold);padding:6px 12px;border-radius:8px;font-size:14px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
/* Confirmación flujo cadena */
.confirm-step{background:var(--surf);border:3px solid var(--gold);border-radius:16px;padding:18px;margin:10px 14px}
.confirm-seq{font-size:11px;font-weight:700;color:var(--mut);letter-spacing:1px;margin-bottom:6px}
.confirm-ref{font-size:22px;font-weight:900;color:var(--pr);font-family:monospace;letter-spacing:2px}
.confirm-desc{font-size:13px;color:var(--mut);margin:2px 0 10px}
.confirm-cant{font-size:48px;font-weight:900;color:var(--gold);text-align:center;line-height:1}
.scan-inp{width:100%;padding:12px 14px;border:2px solid var(--bord);border-radius:10px;font-size:18px;font-family:monospace;text-align:center;letter-spacing:2px;outline:none;transition:border-color .15s;margin:8px 0}
.scan-inp:focus{border-color:var(--gold)}
.scan-inp.ok{border-color:var(--ok);background:var(--ok-l)}
.scan-inp.er{border-color:var(--er);background:var(--er-l)}
.chain-nav{display:flex;gap:8px;padding:8px 14px;background:var(--surf);border-top:1px solid var(--bord);position:sticky;bottom:0}
/* Historial */
.hist-item{background:var(--surf);border-radius:12px;padding:12px 14px;margin:6px 14px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.hist-date{font-size:11px;color:var(--mut)}
.hist-title{font-weight:700;font-size:14px;margin:2px 0}
/* Búsqueda rápida */
.search-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:300;display:none;flex-direction:column}
.search-box{background:var(--surf);padding:14px;border-bottom:3px solid var(--gold)}
.search-results{flex:1;overflow-y:auto;padding:8px 0}
.search-row{padding:12px 16px;border-bottom:1px solid var(--bord);cursor:pointer}
.search-row:active{background:var(--pr-l)}
/* Validación supervisor */
.valid-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:8px;font-size:13px;font-weight:700}
.valid-ok{background:var(--ok-l);color:var(--ok)}
.valid-pend{background:var(--wa-l);color:var(--wa)}
</style>
</head>
<body>
<div class="app" id="app">
  <div id="loader"><div class="spin"></div><div id="ldMsg">Cargando...</div></div>
  <div id="toast"></div>
  <div id="fab" class="fab" onclick="fabAct()">📊</div>
</div>

<script>
// ═══════════════════════════════════════════════════════════
// CONFIGURACIÓN — pon tus credenciales aquí
// ═══════════════════════════════════════════════════════════
const SUPABASE_URL = 'https://ubfbbmoeblpoujgtgglm.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InViZmJibW9lYmxwb3VqZ3RnZ2xtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzMjcxNzIsImV4cCI6MjA5NTkwMzE3Mn0.CcS7fG0-Hiw5EkJ5qsRzT6sQ5RxyBawWjP69YyUeFPI';
// ═══════════════════════════════════════════════════════════

// ── Supabase client ─────────────────────────────────────────
function mkSB(url, key) {
  const H = { apikey: key, Authorization: 'Bearer ' + key, 'Content-Type': 'application/json', Prefer: 'return=representation' };
  const base = url.replace(/\/+$/, '');

  async function req(path, opts = {}) {
    // Fetch ALL rows by paginating with Range header (Supabase default limit = 1000)
    const isSelect = !opts.method || opts.method === 'GET';
    const pageSize = 1000;
    let allRows = null;

    if (isSelect) {
      let offset = 0;
      allRows = [];
      while (true) {
        const rangeHdr = { 'Range': offset + '-' + (offset + pageSize - 1), 'Range-Unit': 'items', 'Prefer': 'count=none' };
        const r = await fetch(base + '/rest/v1/' + path, { ...opts, headers: { ...H, ...(opts.xh || {}), ...rangeHdr } });
        const t = await r.text();
        let j; try { j = t ? JSON.parse(t) : []; } catch { j = []; }
        if (!r.ok) {
          const m = (j && j.message) ? j.message : ('HTTP ' + r.status + (r.status === 404 ? ' — verifica que las tablas existen en Supabase' : ''));
          throw new Error(m);
        }
        if (!Array.isArray(j) || j.length === 0) break;
        allRows = allRows.concat(j);
        if (j.length < pageSize) break;
        offset += pageSize;
      }
      return allRows;
    }

    // Non-select (INSERT, UPDATE, DELETE, UPSERT)
    const r = await fetch(base + '/rest/v1/' + path, { ...opts, headers: { ...H, ...(opts.xh || {}) } });
    const t = await r.text();
    let j; try { j = t ? JSON.parse(t) : []; } catch { j = []; }
    if (!r.ok) {
      const m = (j && j.message) ? j.message : ('HTTP ' + r.status + (r.status === 404 ? ' — verifica que las tablas existen en Supabase' : ''));
      throw new Error(m);
    }
    return j;
  }

  function qb(tbl) {
    let cols = '*', filters = [], ord = null, lim = null;
    const b = {
      select(c) { cols = c || '*'; return b; },
      eq(c, v) { filters.push(c + '=eq.' + encodeURIComponent(v)); return b; },
      neq(c, v) { filters.push(c + '=neq.' + encodeURIComponent(v)); return b; },
      in(c, arr) { filters.push(c + '=in.(' + arr.map(x => encodeURIComponent(x)).join(',') + ')'); return b; },
      ilike(c, v) { filters.push(c + '=ilike.' + encodeURIComponent(v)); return b; },
      order(c, asc = true) { ord = c + (asc ? '.asc' : '.desc'); return b; },
      limit(n) { lim = n; return b; },
      get() {
        let p = tbl + '?select=' + cols;
        filters.forEach(f => { p += '&' + f; });
        if (ord) p += '&order=' + ord;
        if (lim) p += '&limit=' + lim;
        return req(p);
      },
      then(res, rej) { return b.get().then(res, rej); },
    };
    return b;
  }

  return {
    from: t => ({
      select: c => qb(t).select(c),
      insert: rows => req(t, { method: 'POST', body: JSON.stringify(Array.isArray(rows) ? rows : [rows]) }),
      update: data => ({ eq: (c, v) => req(t + '?' + c + '=eq.' + encodeURIComponent(v), { method: 'PATCH', body: JSON.stringify(data) }) }),
      upsert: (rows, onConflict) => req(t + (onConflict ? '?on_conflict=' + onConflict : ''), { method: 'POST', body: JSON.stringify(Array.isArray(rows) ? rows : [rows]), xh: { Prefer: 'resolution=merge-duplicates,return=representation' } }),
      delete: () => ({
        eq: (c, v) => req(t + '?' + c + '=eq.' + encodeURIComponent(v), { method: 'DELETE' }),
        all: () => req(t + '?id=gte.0', { method: 'DELETE' }),
      }),
    }),
  };
}
const sb = mkSB(SUPABASE_URL, SUPABASE_KEY);

// ── UM: extraer factor de empaque de "C24", "DP12", etc. ──────
function factorUM(um) {
  if (!um) return 1;
  const s = String(um).trim().toUpperCase();
  // Formatos: C24, C6, CJ12, DP20, etc. — extraer número al final
  const m = s.match(/(\d+(?:[.,]\d+)?)$/);
  if (m) {
    const n = parseFloat(m[1].replace(',','.'));
    return n > 1 ? n : 1;
  }
  return 1;
}
// Convierte unidades totales → { cajas, sueltas } según UM
function aCajasYSueltas(cant, um) {
  const f = factorUM(um);
  if (f <= 1) return { cajas: 0, sueltas: cant, factor: 1 };
  const cajas   = Math.floor(cant / f);
  const sueltas = Math.round((cant % f) * 100) / 100;
  return { cajas, sueltas, factor: f };
}
// Formatea cantidad con desglose cajas + sueltas
function fmtCantUM(cant, um) {
  const f = factorUM(um);
  if (f <= 1 || !cant) return fmtn(cant) + ' ' + e(um || 'UND');
  const { cajas, sueltas } = aCajasYSueltas(cant, um);
  if (cajas === 0)   return fmtn(sueltas) + ' und';
  if (sueltas === 0) return fmtn(cajas) + ' caj. (' + fmtn(cant) + ' und)';
  return fmtn(cajas) + ' caj. + ' + fmtn(sueltas) + ' und &nbsp;<span style="font-size:11px;color:var(--mut)">(' + fmtn(cant) + ' und total)</span>';
}

// ── Helpers de formato de campos ─────────────────────────────
// Texto limpio: quita espacios pero preserva ceros a la izquierda
const txt  = v => (v === null || v === undefined) ? '' : String(v).trim();
// Número (solo para cantidades reales)
const num  = v => { const n = parseFloat(String(v).replace(',','.')); return isNaN(n) ? null : n; };
// Booleano desde SI/NO/TRUE/FALSE/1/0
const bool = v => { const s = txt(v).toUpperCase(); return s === 'SI' || s === 'TRUE' || s === '1' || s === 'YES'; };
// Fecha: toma datetime string y devuelve solo YYYY-MM-DD o null
const fecha = v => { if (!v || txt(v) === '') return null; const s = txt(v).substring(0,10); return s.length === 10 ? s : null; };
// Alias para fmtCO (ya no transforma, solo limpia — los archivos ya vienen con ceros)
const fmtCO = v => txt(v);

// ── Estado global ────────────────────────────────────────────
let G = {
  user: null,      // { id, nombre, perfil_ids[], co_ids[] }
  co: null,        // { id, nombre }
  perfil: null,    // 'admin' | 'supervisor' | 'alistador'
};

// ── UI helpers ───────────────────────────────────────────────
const $app = document.getElementById('app');
const $ld  = document.getElementById('loader');
const $ldm = document.getElementById('ldMsg');
const $tst = document.getElementById('toast');
const $fab = document.getElementById('fab');
let tTimer;

const ld  = (m = 'Cargando...') => { $ldm.textContent = m; $ld.style.display = 'flex'; };
const uld = () => { $ld.style.display = 'none'; };
function toast(m, t = 'ok') {
  clearTimeout(tTimer);
  $tst.innerHTML = (t === 'er' ? '❌ ' : t === 'wa' ? '⚠️ ' : '✅ ') + m;
  $tst.style.background = t === 'er' ? 'var(--er)' : t === 'wa' ? 'var(--wa)' : 'var(--ok)';
  $tst.style.display = 'block';
  // Errores y advertencias necesitan cierre manual; éxitos desaparecen solos
  if (t === 'er' || t === 'wa') {
    $tst.onclick = () => { $tst.style.display = 'none'; };
    $tst.style.cursor = 'pointer';
    $tst.title = 'Toca para cerrar';
  } else {
    $tst.onclick = null; $tst.style.cursor = 'default';
    tTimer = setTimeout(() => { $tst.style.display = 'none'; }, 5000);
  }
}
const rdr  = html => { $app.innerHTML = html; };
function cerrarSesion() {
  if (!confirm('¿Cerrar sesión?')) return;
  G = { user: null, co: null, perfil: null };
  pgLogin();
}
const e    = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const fmtn = n => n == null ? '' : Number(n).toLocaleString('es-CO');

// Pct badge color
function pctBadge(done, total) {
  if (!total) return '<span class="badge b-gray">Sin items</span>';
  const p = Math.round(done / total * 100);
  const cls = p === 100 ? 'b-ok' : p > 0 ? 'b-wa' : 'b-gray';
  return `<span class="badge ${cls}">${p}%</span>`;
}

async function doLogin() {
  const uid = document.getElementById('liUser').value.trim();
  const pwd = document.getElementById('liPass').value;
  if (!uid || !pwd) { showLoginErr('Ingresa usuario y contraseña'); return; }
  ld('Verificando...');
  try {
    const rows = await sb.from('usuarios').select('*').eq('usuario_id', uid);
    uld();
    if (!Array.isArray(rows) || rows.length === 0) { showLoginErr('Usuario no encontrado'); return; }
    const u = rows[0];
    if (String(u.contrasena) !== String(pwd)) { showLoginErr('Contraseña incorrecta'); return; }
    G.user = {
      id: u.id,
      nombre: u.nombre,
      perfil_ids: String(u.perfiles || '').split(',').map(s => s.trim().toLowerCase()).filter(Boolean),
      co_ids: String(u.centros_operacion || '').split(',').map(s => fmtCO(s.trim())).filter(Boolean),
    };
    pgSelectCO();
  } catch(err) {
    uld();
    showLoginErr('Error: ' + err.message);
  }
}

function showLoginErr(m) {
  const el = document.getElementById('liErr');
  if (el) { el.textContent = m; el.style.display = 'block'; }
}

  try {
    const rows = await sb.from('zonas').select('*').eq('co', G.co.id).order('secuencia', true);
    const kRows = await sb.from('kits').select('referencia').get();
    const kitRefs = new Set((Array.isArray(kRows) ? kRows : []).map(r => String(r.referencia)));
    uld();
    renderTablaZonas(Array.isArray(rows) ? rows : [], kitRefs);
  } catch(err) { uld(); toast('Error: ' + err.message, 'er'); }
}

  if (filtros.desc) datos = datos.filter(r => String(r.descripcion||'').toLowerCase().includes(filtros.desc.toLowerCase()));
  if (filtros.zona) datos = datos.filter(r => r.zona === filtros.zona);
  if (filtros.bod)  datos = datos.filter(r => String(r.bodega_id) === filtros.bod);

  let html = `<div class="hdr">
    <button class="hdr-btn" onclick="pgAdmin()">← Admin</button>

    <button class="hdr-btn" onclick="saveZonas()">💾 Guardar</button>

      ${zonaOpts.map(z=>`<option value="${e(z)}" ${filtros.zona===z?'selected':''}>${e(z)}</option>`).join('')}
    </select>
    <select onchange="window.zonaFiltros.bod=this.value;refreshZonasTbody(window._zonaRows,window._kitRefs,window.zonaFiltros)">
      <option value="">Todas las bodegas</option>
      ${bodOpts.map(b=>`<option value="${e(String(b))}" ${filtros.bod===String(b)?'selected':''}>${e(String(b))}</option>`).join('')}
    </select>
  </div>
  <div style="padding:8px 14px 4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap">
    <span id="zonaCount" style="font-size:12px;color:var(--mut);flex:1">${datos.length} de ${rows.length}</span>
    <button class="btn btn-sm btn-ok" onclick="openNuevaZona()">＋ Nueva</button>
    <label class="file-btn" style="background:#0f766e;display:inline-flex;width:auto;padding:6px 10px;font-size:12px;margin-top:0">📂 Cargar<input type="file" accept=".xlsx,.xls" onchange="handleZonasFile(event)"/></label>
    <button class="btn btn-sm" style="background:#1d4ed8;color:#fff" onclick="exportTableFiltrado('zonas',window._zonaRows,window.zonaFiltros)">📥 Exportar</button>
  </div>
  <div class="tbl-wrap" style="margin:4px 14px">
  <table class="tbl" id="zonasTbl">
    <thead><tr>
      <th>Ref.</th><th>Descripción</th><th>Bodega</th><th>Zona</th><th>Sec.</th><th>Desglosar</th><th></th>
    </tr></thead><tbody id="zonasTbody">`;

  datos.forEach(row => {
    const esKit = kitRefs.has(String(row.referencia));
    const rowEnc = encodeURIComponent(JSON.stringify({id:row.id,referencia:row.referencia,descripcion:row.descripcion,bodega_id:row.bodega_id,zona:row.zona,secuencia:row.secuencia,desglosar_oferta:row.desglosar_oferta,co:row.co}));
    html += `<tr data-id="${row.id}" data-dirty="">
      <td style="white-space:nowrap;max-width:80px;overflow:hidden;text-overflow:ellipsis" title="${e(String(row.referencia||''))}">${e(String(row.referencia||''))}</td>

      <td>${e(String(row.bodega_id||''))}</td>
      <td><input class="edit-inp" value="${e(String(row.zona||''))}" data-f="zona" onchange="markDirty(this)" style="width:90px"/></td>
      <td><input class="edit-inp" type="number" value="${row.secuencia||''}" data-f="secuencia" style="width:52px;text-align:center" onchange="markDirty(this)"/></td>
      <td style="text-align:center">${esKit ? `<label class="tog"><input type="checkbox" data-f="desglosar_oferta" ${row.desglosar_oferta?'checked':''} onchange="markDirty(this)"/><span class="tog-sl"></span></label>` : '<span style="color:var(--mut);font-size:11px">—</span>'}</td>

  window._zonaRows = rows; window._kitRefs = kitRefs; window.zonaFiltros = filtros;
  rdr(html);
}

function refreshZonasTbody(rows, kitRefs, filtros) {
  window._zonaRows = rows; window._kitRefs = kitRefs; window.zonaFiltros = filtros;
  const zonaOpts = [...new Set((window._zonaRows||[]).map(r=>r.zona).filter(Boolean))].sort();
  let datos = rows;
  if (filtros.ref)  datos = datos.filter(r => String(r.referencia||'').toLowerCase().includes(filtros.ref.toLowerCase()));
  if (filtros.desc) datos = datos.filter(r => String(r.descripcion||'').toLowerCase().includes(filtros.desc.toLowerCase()));
  if (filtros.zona) datos = datos.filter(r => r.zona === filtros.zona);
  if (filtros.bod)  datos = datos.filter(r => String(r.bodega_id) === filtros.bod);
  const tbody = document.getElementById('zonasTbody');
  if (!tbody) { renderTablaZonas(rows, kitRefs, filtros); return; }
  let tbHtml = '';
  datos.forEach(row => {
    const esKit = kitRefs.has(String(row.referencia));
    tbHtml += `<tr data-id="${row.id}" data-dirty="">
      <td><input class="edit-inp" value="${e(String(row.referencia||''))}" data-f="referencia" onchange="markDirty(this)"/></td>
      <td><input class="edit-inp" value="${e(String(row.descripcion||''))}" data-f="descripcion" onchange="markDirty(this)"/></td>
      <td><input class="edit-inp" value="${e(String(row.bodega_id||''))}" data-f="bodega_id" style="width:70px" onchange="markDirty(this)"/></td>
      <td><input class="edit-inp" value="${e(String(row.zona||''))}" data-f="zona" onchange="markDirty(this)"/></td>
      <td><input class="edit-inp" type="number" value="${row.secuencia||''}" data-f="secuencia" style="width:55px;text-align:center" onchange="markDirty(this)"/></td>
      <td style="text-align:center">${esKit ? `<label class="tog"><input type="checkbox" data-f="desglosar_oferta" ${row.desglosar_oferta?'checked':''} onchange="markDirty(this)"/><span class="tog-sl"></span></label>` : '<span style="color:var(--mut);font-size:11px">N/A</span>'}</td>
      <td><button class="btn btn-sm btn-er" onclick="deleteZona(\'' + row.id + '\')">🗑</button></td>
    </tr>`;
  });
  tbody.innerHTML = tbHtml;
  const countEl = document.getElementById('zonaCount');
  if (countEl) countEl.textContent = datos.length + ' de ' + rows.length;
}

function markDirty(el) { el.closest('tr').dataset.dirty = '1'; }

async function saveZonas() {
  const rows = document.querySelectorAll('#zonasTbl tbody tr[data-dirty="1"]');
  if (!rows.length) { toast('Sin cambios', 'wa'); return; }
  ld('Guardando ' + rows.length + ' cambios...');
  let ok = 0, errs = 0;
  for (const row of rows) {
    const id = row.dataset.id;
    const upd = {};
    row.querySelectorAll('[data-f]').forEach(f => {
      const field = f.dataset.f;
      if (field === 'desglosar_oferta') upd[field] = f.checked;
      else if (field === 'secuencia') upd[field] = f.value ? parseInt(f.value) : null;
      else upd[field] = f.value;
    });
    try { await sb.from('zonas').update(upd).eq('id', id); row.dataset.dirty = ''; ok++; }
    catch { errs++; }
  }
  uld();
  toast(errs ? `${ok} ok, ${errs} errores` : `✅ ${ok} actualizadas`, errs ? 'wa' : 'ok');
}

async function handleZonasFile(event) {
  const file = event.target.files[0]; if (!file) return;
  ld('Procesando zonas...');
  try {
    const ab = await file.arrayBuffer();
    const wb = XLSX.read(ab);
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, { defval: '' });
    const records = rows.map(r => ({
      referencia:       txt(r['REFERENCIA']      || r['Referencia']     || ''),
      descripcion:      txt(r['DESCRIPCION']     || r['Descripcion']    || ''),
      zona:             txt(r['ZONA']            || r['Zona']           || '').toUpperCase(),
      secuencia:        num(r['SECUENCIA']       || r['Secuencia']      || ''),
      desglosar_oferta: bool(r['DESGLOSAR_OFERTA']|| r['Desglosar oferta'] || ''),
      bodega_id:        txt(r['BODEGA_ID']       || r['Bodega']         || ''),
      co:               txt(r['C.O.']            || r['co']             || '') || G.co.id,
    })).filter(r => r.referencia && r.zona);

    if (!records.length) { uld(); toast('No se encontraron datos válidos', 'er'); return; }
    // Upsert por referencia+bodega+co
    // Group by CO and delete existing, then insert fresh
    ld('Procesando ' + records.length + ' zonas...');
    const cosEnFile = [...new Set(records.map(r => r.co).filter(Boolean))];
    let zOk = 0, zErr = 0, zErrMsg = '';
    for (const co of cosEnFile) {
      try { await sb.from('zonas').delete().eq('co', co); } catch(e) { console.warn('zonas delete', co, e.message); }
    }
    for (let i = 0; i < records.length; i += 100) {
      try {
        await sb.from('zonas').insert(records.slice(i, i+100));
        zOk += Math.min(100, records.length - i);
      } catch(e) {
        zErr += Math.min(100, records.length - i);
        zErrMsg = e.message;
        console.error('Zonas insert batch', i, ':', e.message);
      }
    }
    uld();
    const zMsg = zErr > 0 ? zOk + ' ok, ' + zErr + ' errores: ' + zErrMsg.substring(0,80) : zOk + ' zonas actualizadas';
    toast(zErr > 0 ? zMsg : '✅ ' + zMsg, zErr > 0 ? 'wa' : 'ok');
    logImportacion('zonas', zOk, zErr>0?'parcial':'exito', zOk+' zonas actualizadas', zErr, zErr>0?zErrMsg:'');
    pgTablaZonas();
  } catch(err) {
    uld();
    toast('Error: ' + err.message, 'er');

async function handleKitsFile(event) {
  const file = event.target.files[0]; if (!file) return;
  ld('Procesando kits...');
  try {
    const ab = await file.arrayBuffer();
    const wb = XLSX.read(ab);
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, { defval: '' });
    const records = rows.map(r => ({
      referencia:         txt(r['Referencia']        || r['REFERENCIA']        || Object.values(r)[0] || ''),
      desc_item:          txt(r['Desc. item']         || r['DESC_ITEM']         || Object.values(r)[1] || ''),
      referencia_comp:    txt(r['Referencia comp.']   || r['REF_COMP']          || Object.values(r)[2] || ''),
      desc_item_comp:     txt(r['Desc. item comp.']   || r['DESC_COMP']         || Object.values(r)[3] || ''),
      cantidad_requerida: num(r['Cantidad Requerida'] || r['CANTIDAD']          || Object.values(r)[4] || 0),
    })).filter(r => r.referencia && r.referencia_comp && r.cantidad_requerida > 0);

    if (!records.length) { uld(); toast('No se encontraron kits válidos', 'er'); return; }
    // Delete existing kits for refs in this file, then insert fresh
    ld('Procesando ' + records.length + ' componentes...');
    const refsEnFile = [...new Set(records.map(r => r.referencia))];
    let kOk = 0, kErr = 0, kErrMsg = '';
    // Delete in batches of refs
    for (let i = 0; i < refsEnFile.length; i += 50) {
      const batch = refsEnFile.slice(i, i+50);
      for (const ref of batch) {
        try { await sb.from('kits').delete().eq('referencia', ref); } catch(e) { console.warn('kit delete', ref, e.message); }
      }
    }
    // Insert fresh
    for (let i = 0; i < records.length; i += 100) {
      try {
        await sb.from('kits').insert(records.slice(i, i+100));
        kOk += Math.min(100, records.length - i);
      } catch(e) {
        kErr += Math.min(100, records.length - i);
        kErrMsg = e.message;
        console.error('Kits insert batch', i, ':', e.message);
      }
    }
    uld();
    const kMsg = kErr > 0 ? kOk + ' ok, ' + kErr + ' errores: ' + kErrMsg.substring(0,80) : kOk + ' componentes actualizados';
    toast(kErr > 0 ? kMsg : '✅ ' + kMsg, kErr > 0 ? 'wa' : 'ok');
    logImportacion('kits', kOk, kErr>0?'parcial':'exito', kOk+' componentes actualizados', kErr, kErr>0?kErrMsg:'');
    pgTablaKits();
  } catch(err) {
    uld();
    toast('Error: ' + err.message, 'er');
    logImportacion('kits', 0, 'error', 'Fallo total', 0, err.message);
  }
}

function markDirtyU(el) { el.closest('tr').dataset.dirty = '1'; }

async function saveUsuarios() {
  const rows = document.querySelectorAll('#uTbl tbody tr[data-dirty="1"]');
  if (!rows.length) { toast('Sin cambios', 'wa'); return; }
  ld('Guardando...');
  let ok = 0, errs = 0;
  for (const row of rows) {
    const id = row.dataset.id;
    const upd = {};
    row.querySelectorAll('[data-f]').forEach(f => {
      upd[f.dataset.f] = f.type === 'checkbox' ? f.checked : f.value;
    });
    try { await sb.from('usuarios').update(upd).eq('id', id); row.dataset.dirty = ''; ok++; }
    catch { errs++; }
  }
  uld();
  toast(errs ? `${ok} ok, ${errs} errores` : `✅ ${ok} actualizados`, errs ? 'wa' : 'ok');
}

function markDirtyB(el) { el.closest('tr').dataset.dirty = '1'; }

async function saveBodegas() {
  const rows = document.querySelectorAll('#bodTbl tbody tr[data-dirty="1"]');
  if (!rows.length) { toast('Sin cambios', 'wa'); return; }
  ld('Guardando ' + rows.length + ' cambios...');
  let ok = 0, errs = 0;
  for (const row of rows) {
    const id = row.dataset.id;
    const upd = {};
    row.querySelectorAll('[data-f]').forEach(f => { upd[f.dataset.f] = f.value; });
    try { await sb.from('bodegas').update(upd).eq('id', id); row.dataset.dirty = ''; ok++; }
    catch { errs++; }
  }
  uld();
  toast(errs ? ok + ' ok, ' + errs + ' errores' : '✅ ' + ok + ' bodegas actualizadas', errs ? 'wa' : 'ok');
}

async function handleBodegasFile(event) {
  const file = event.target.files[0]; if (!file) return;
  ld('Procesando bodegas...');
  try {
    const ab = await file.arrayBuffer();
    const wb = XLSX.read(ab);
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, { defval: '' });
    const records = rows.map(r => ({
      codigo:            txt(r['Código']            || r['CODIGO']            || ''),
      descripcion:       txt(r['Descripción']       || r['DESCRIPCION']       || ''),
      co:                txt(r['C.O.']              || r['CO']                || ''),
      instalacion:       txt(r['Instalación']       || r['INSTALACION']       || '') || null,
      desc_co:           txt(r['Descripción C.O.']  || r['DESC_CO']           || ''),
      estado:            txt(r['Estado']            || r['ESTADO']            || 'Activo'),
      // departamento y ciudad vienen como número en el Excel — guardar como texto
      departamento:      txt(r['Departamento']      || r['DEPARTAMENTO']      || '') || null,
      ciudad:            txt(r['ciudad']            || r['CIUDAD']            || '') || null,
      desc_departamento: txt(r['Desc. Departamento']|| r['DESC_DEPARTAMENTO'] || ''),
      desc_ciudad:       txt(r['Desc. Ciudad']      || r['DESC_CIUDAD']       || ''),
      direccion:         txt(r['Dirección-1']       || r['DIRECCION']         || ''),
      notas:             txt(r['Notas']             || '') || null,
    })).filter(r => r.codigo && r.co);
    if (!records.length) { uld(); toast('Sin datos válidos', 'er'); return; }
    ld('Actualizando ' + records.length + ' bodegas...');
    let upsOk = 0, upsErr = 0, errMsg = '';
    for (let i = 0; i < records.length; i += 100) {
      try {
        await sb.from('bodegas').upsert(records.slice(i, i+100), 'codigo');
        upsOk += Math.min(100, records.length - i);
      } catch(e) {
        const batchErr = Math.min(100, records.length - i);
        upsErr += batchErr;
        errMsg = e.message;
        console.error('Upsert batch', i, ':', e.message);
      }
    }
    uld();
    const bMsg = upsErr > 0
      ? upsOk + ' actualizadas, ' + upsErr + ' errores: ' + errMsg.substring(0,80)
      : upsOk + ' bodegas actualizadas';
    toast(upsErr > 0 ? bMsg : '✅ ' + bMsg, upsErr > 0 ? 'wa' : 'ok');
    logImportacion('bodegas', upsOk, upsErr>0?'parcial':'exito', upsOk+' bodegas actualizadas', upsErr, upsErr>0?errMsg:'');
    pgTablaBodegas();
  } catch(err) {
    uld();
    toast('Error: ' + err.message, 'er');
    logImportacion('bodegas', 0, 'error', 'Fallo total', 0, err.message);
    console.error('handleBodegasFile:', err);
  }
}

function refreshPedidosTbody(rows, filtros) {
  window._pRows = rows; window.pFiltros = filtros;
  let datos = rows;
  if (filtros.doc)  datos = datos.filter(r => String(r.nro_documento||'').toLowerCase().includes(filtros.doc.toLowerCase()));
  if (filtros.ref)  datos = datos.filter(r => String(r.referencia||'').toLowerCase().includes(filtros.ref.toLowerCase()));
  if (filtros.bod)  datos = datos.filter(r => r.bodega === filtros.bod);
  if (filtros.est)  datos = datos.filter(r => r.estado_movto === filtros.est);
  if (filtros.prep && filtros.prep !== 'todos') datos = datos.filter(r => r.estado_prep === filtros.prep);

  if (!tbody) { renderTablaPedidos(rows, filtros); return; }
  const countEl = document.getElementById('pedCount');
  if (countEl) countEl.textContent = datos.length + ' de ' + rows.length;
  let tbHtml = '';
  datos.slice(0, 500).forEach(r => {
    const prep = r.estado_prep || 'pendiente';
    const prepCls = prep === 'completo' ? 'b-ok' : prep === 'parcial' ? 'b-wa' : 'b-gray';

    tbHtml += `<tr data-id="${r.id}">
      <td><input type="checkbox" class="ped-sel" data-id="${r.id}" style="cursor:pointer"/></td>
      <td style="white-space:nowrap">${e(String(r.nro_documento||''))}</td>

      <td style="max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${e(String(r.desc_item||''))}">${e(String(r.desc_item||''))}</td>

      <td>${e(String(r.desc_ciudad||''))}</td>
      <td style="text-align:right">${fmtn(r.cant_comprometida)}</td>
      <td style="white-space:nowrap">${e(String(r.fecha_entrega||'').substring(0,10))}</td>
      <td><span class="badge ${prepCls}">${prep}</span></td>
      <td><button class="btn btn-sm" style="background:var(--gold);color:var(--pr);padding:4px 8px" onclick="openDetalleRow('pedidos','${pEnc}')">✏️</button></td>

  tbody.innerHTML = tbHtml;
}

function refreshReqTbody(rows, filtros) {
  window._rqRows = rows; window.rFiltros = filtros;
  let datos = rows;
  if (filtros.doc)  datos = datos.filter(r => String(r.nro_documento||'').toLowerCase().includes(filtros.doc.toLowerCase()));
  if (filtros.ref)  datos = datos.filter(r => String(r.referencia||'').toLowerCase().includes(filtros.ref.toLowerCase()));
  if (filtros.bod)  datos = datos.filter(r => r.bodega === filtros.bod);
  if (filtros.prep && filtros.prep !== 'todos') datos = datos.filter(r => r.estado_prep === filtros.prep);
  const tbody = document.getElementById('reqTbody');
  if (!tbody) { renderTablaRequisiciones(rows, filtros); return; }
  let tbHtml = '';
  datos.slice(0, 500).forEach(r => {
    const prep = r.estado_prep || 'pendiente';
    const prepCls = prep === 'completo' ? 'b-ok' : prep === 'parcial' ? 'b-wa' : 'b-gray';
    const rqEnc = encodeURIComponent(JSON.stringify({id:r.id,nro_documento:r.nro_documento,referencia:r.referencia,desc_item:r.desc_item,bodega:r.bodega,bodega_entrada:r.bodega_entrada,bodega_salida:r.bodega_salida,cant_comprometida:r.cant_comprometida,um:r.um,estado_movto:r.estado_movto,estado_prep:r.estado_prep,motivo:r.motivo,co:r.co,fecha_entrega:r.fecha_entrega}));
    tbHtml += '<tr data-id="' + r.id + '">' +
      '<td><input type="checkbox" class="req-sel" data-id="' + r.id + '" style="cursor:pointer"/></td>' +
      '<td style="white-space:nowrap">' + e(String(r.nro_documento||'')) + '</td>' +
      '<td>' + e(String(r.referencia||'')) + '</td>' +
      '<td style="max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="' + e(String(r.desc_item||'')) + '">' + e(String(r.desc_item||'')) + '</td>' +
      '<td>' + e(String(r.bodega||'')) + '</td>' +
      '<td>' + e(String(r.fecha_entrega||'').substring(0,10)) + '</td>' +
      '<td style="text-align:right">' + fmtn(r.cant_comprometida) + '</td>' +

  tbody.innerHTML = tbHtml;
}

async function handleRequisicionesFile(event) {
  const file = event.target.files[0]; if (!file) return;
  ld('Procesando requisiciones...');
  try {
    const ab = await file.arrayBuffer();
    const wb = XLSX.read(ab);
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, { defval: '' });
    const records = rows.map(r => {
      const nroDoc = txt(r['Nro documento'] || '');
      // CO viene del prefijo del número de documento: "073-RQT-00001559" → "073"
      const coFromDoc = nroDoc.match(/^(\d+)-/) ? nroDoc.match(/^(\d+)-/)[1] : '';
      const coField   = txt(r['C.O. movto.'] || r['C.O.'] || '');
      const co        = coFromDoc || coField;
      const bodSalida = txt(r['Bodega salida'] || '');
      const bodEntrada= txt(r['Bodega entrada'] || '');
      return {
        nro_documento:     nroDoc,
        referencia_docto:  txt(r['Referencia Docto.']          || ''),
        fecha_docto:       fecha(r['Fecha docto']              || ''),
        fecha_entrega:     fecha(r['Fecha de entrega movto.']  || ''),
        notas:             txt(r['Notas docto']                || ''),
        referencia:        txt(r['Referencia']                 || ''),
        desc_item:         txt(r['Desc. item']                 || ''),
        bodega:            bodSalida,           // bodega de despacho = salida
        bodega_entrada:    bodEntrada,
        bodega_salida:     bodSalida,
        nro_registro:      txt(r['Nro. registro']              || ''),
        ubicacion_entrada: txt(r['Ubicación entrada']          || ''),
        um:                txt(r['U.M. ']  || r['U.M.']        || ''),
        um_emp:            txt(r['U.M. Emp.']                  || ''),
        codigo_barra:      txt(r['Código barras principal']    || ''),
        cant_comprometida: num(r['Cant. comprometida']         || 0),
        motivo:            txt(r['Motivo']                     || ''),
        estado_movto:      txt(r['Estado movto.']              || ''),
        estado_docto:      txt(r['Estado docto.']              || ''),
        co,
        grupo:             txt(r['GRUPO']                      || ''),
        grupo_shopper:     txt(r['GRUPO SHOPPER']              || ''),
        desc_co:           txt(r['Desc. C.O. movto.']          || ''),
        estado_prep:       'pendiente',
      };
    }).filter(r => r.nro_documento && r.referencia && r.co);

    if (!records.length) { uld(); toast('Sin datos válidos', 'er'); return; }
    const coVal = records[0].co;
    ld('Actualizando ' + records.length + ' requisiciones CO ' + coVal + '...');
    let rOk = 0, rErr = 0, rErrMsg = '';
    for (let i = 0; i < records.length; i += 100) {
      try {
        await sb.from('requisiciones').upsert(records.slice(i, i+100), 'nro_documento,referencia,bodega');
        rOk += Math.min(100, records.length - i);
      } catch(e) {
        rErr += Math.min(100, records.length - i);
        rErrMsg = e.message;
        console.error('Req upsert batch', i, ':', e.message);
      }
    }
    uld();
    const rMsg = rErr > 0 ? rOk + ' ok, ' + rErr + ' errores: ' + rErrMsg.substring(0,80) : rOk + ' requisiciones actualizadas';
    toast(rErr > 0 ? rMsg : '✅ ' + rMsg, rErr > 0 ? 'wa' : 'ok');
    logImportacion('requisiciones', rOk, rErr>0?'parcial':'exito', rOk+' requisiciones actualizadas', rErr, rErr>0?rErrMsg:'');
    // Auto-populate zonas with new ref+bodega combinations
    autoPopularZonas(records, 'requisiciones');
    pgSupervisor();
  } catch(err) {
    uld();
    toast('Error: ' + err.message, 'er');
    logImportacion('requisiciones', 0, 'error', 'Fallo total', 0, err.message);
  }
}

function openDetalleRow(tabla, rowData) {
  const row = typeof rowData === 'string' ? JSON.parse(decodeURIComponent(rowData)) : rowData;
  const campos = Object.entries(row).filter(([k]) => !k.startsWith('_') && k !== 'id');
  const boolFields = ['desglosar_oferta','activo','lotes','multiubicaciones'];
  let formHtml = '';
  campos.forEach(([k, v]) => {
    const label = k.replace(/_/g,' ').toUpperCase();
    if (boolFields.includes(k)) {
      formHtml += `<span class="inp-label">${label}</span>
        <label class="tog" style="margin:6px 0 10px;display:block">
          <input type="checkbox" id="dr_${k}" ${v?'checked':''}/>
          <span class="tog-sl"></span>
        </label>`;
    } else {
      formHtml += `<span class="inp-label">${label}</span>
        <input id="dr_${k}" class="inp" value="${e(String(v||''))}" style="margin-bottom:4px"/>`;
    }
  });
  document.body.insertAdjacentHTML('beforeend', `
    <div class="overlay" id="detalleModal" style="display:flex" onclick="if(event.target.id==='detalleModal')event.target.remove()">
      <div class="modal" style="max-height:92vh">
        <div class="modal-hdl"></div>
        <div style="font-weight:700;font-size:15px;margin-bottom:12px">✏️ Editar registro — ${tabla}</div>
        ${formHtml}
        <div style="display:flex;gap:8px;margin-top:14px">
          <button class="btn btn-sec" style="flex:1" onclick="document.getElementById('detalleModal').remove()">Cancelar</button>
          <button class="btn btn-pr" style="flex:1;color:var(--gold)" onclick="saveDetalleRow('${tabla}','${row.id}')">💾 Guardar</button>
        </div>
      </div>
    </div>`);
}

async function saveDetalleRow(tabla, id) {
  const modal = document.getElementById('detalleModal');
  if (!modal) return;
  const inputs = modal.querySelectorAll('[id^="dr_"]');
  const upd = {};
  inputs.forEach(inp => {
    const key = inp.id.replace('dr_', '');
    upd[key] = inp.type === 'checkbox' ? inp.checked : inp.value;
  });
  ld('Guardando...');
  try {
    await sb.from(tabla).update(upd).eq('id', id);
    modal.remove();
    uld(); toast('✅ Cambio guardado');
    // Reload current table
    if (tabla==='bodegas') pgTablaBodegas();
    else if (tabla==='zonas') pgTablaZonas();
    else if (tabla==='usuarios') pgTablaUsuarios();
    else if (tabla==='kits') pgTablaKits();
    else if (tabla==='pedidos') pgTablaPedidos();
    else if (tabla==='requisiciones') pgTablaRequisiciones();
  } catch(e) { uld(); toast('Error: ' + e.message, 'er'); }
}

// AUTO-POPULAR ZONAS
// Inserta combinaciones ref+bodega que no existan en zonas
// ═══════════════════════════════════════════════════════════════
async function autoPopularZonas(records, tipo) {
  try {
    // Get existing zona keys for this CO
    const existing = await sb.from('zonas').select('referencia,bodega_id,co').eq('co', G.co.id);
    const existKeys = new Set(
      (Array.isArray(existing) ? existing : []).map(z => z.referencia + '|' + z.bodega_id + '|' + z.co)
    );
    // Build new unique ref+bodega+co combos from incoming records
    const seen = new Set();
    const nuevas = [];
    records.forEach(r => {
      const ref  = txt(r.referencia || '');
      const bod  = tipo === 'requisiciones' ? txt(r.bodega_salida || r.bodega || '') : txt(r.bodega || '');
      const co   = txt(r.co || G.co.id);
      const desc = txt(r.desc_item || '');
      if (!ref || !bod || !co) return;
      const key = ref + '|' + bod + '|' + co;
      if (!seen.has(key) && !existKeys.has(key)) {
        seen.add(key);
        nuevas.push({ referencia: ref, descripcion: desc, bodega_id: bod, co, zona: 'SIN ZONA', secuencia: null, desglosar_oferta: false });
      }
    });
    if (!nuevas.length) return;
    for (let i = 0; i < nuevas.length; i += 100) {
      await sb.from('zonas').insert(nuevas.slice(i, i+100));
    }
    console.log('Auto-populated zonas:', nuevas.length, 'nuevas referencias');
    toast('ℹ️ ' + nuevas.length + ' referencias nuevas agregadas a Zonas (sin zona asignada)', 'wa');
  } catch(e) {
    console.warn('autoPopularZonas error:', e.message);
  }
}

// ALISTADOR

let _alItems = [];     // items del picking actual
let _alZona  = null;   // zona activa
let _alTipo  = null;   // 'pedidos' | 'requisiciones'
let _kitsMap = {};
let _chainIdx = 0;     // índice del ítem actual en el flujo cadena
let _chainItems = [];  // lista ordenada de ítems pendientes de la zona activa

// pgAlistador: pantalla de filtros — se llama al entrar al perfil
async function pgAlistador() {
  ld('Cargando opciones...');
  try {
    // Cargar solo lo necesario para poblar filtros
    const [ped, req, kits] = await Promise.all([
      sb.from('pedidos').select('id,nro_documento,referencia,desc_item,bodega,desc_ciudad,zona_logistica,cant_comprometida,um_emp,estado_prep,motivo,cant_alistada,co').eq('co', G.co.id),
      sb.from('requisiciones').select('id,nro_documento,referencia,desc_item,bodega,cant_comprometida,um,um_emp,estado_prep,motivo,cant_alistada,co').eq('co', G.co.id),
      sb.from('kits').select('*'),
    ]);
    // Build kits map
    _kitsMap = {};
    (Array.isArray(kits) ? kits : []).forEach(k => {
      if (!_kitsMap[k.referencia]) _kitsMap[k.referencia] = [];
      _kitsMap[k.referencia].push({ ref: k.referencia_comp, desc: k.desc_item_comp, qty: parseFloat(k.cantidad_requerida) });
    });
    // Load zonas para el CO
    const zonas = await sb.from('zonas').select('*').eq('co', G.co.id);
    // zonaMap: clave = referencia|bodega — tanto zonas.bodega_id como pedidos.bodega deben coincidir
    const zonaMap = {};
    (Array.isArray(zonas) ? zonas : []).forEach(z => {
      // Guardar por referencia+bodega (sin CO — ya filtrado por CO arriba)
      const key = String(z.referencia).trim() + '|' + String(z.bodega_id).trim();
      zonaMap[key] = z;
    });

    // Debug: log a few keys to verify
    console.log('zonaMap keys (first 5):', Object.keys(zonaMap).slice(0,5));
    console.log('Pedidos bodega sample:', (Array.isArray(ped)?ped:[]).slice(0,3).map(p=>p.referencia+'|'+p.bodega));

    // Enrich items with zona info
    const enrichOne = (it, tipo) => {
      // Usar el campo bodega del item (ya filtrado por CO al hacer la query)
      const key = String(it.referencia).trim() + '|' + String(it.bodega).trim();
      const z = zonaMap[key] || {};
      return {
        ...it,
        _tipo: tipo,
        _zona: z.zona || 'SIN ZONA',
        _seq: z.secuencia != null ? z.secuencia : 9999,
        _desglosar: z.desglosar_oferta || false,
        zona_logistica: it.zona_logistica || '',
      };
    };
    const allRaw = [
      ...(Array.isArray(ped) ? ped : []).map(i => enrichOne(i, 'pedidos')),
      ...(Array.isArray(req) ? req : []).map(i => enrichOne(i, 'requisiciones')),
    ];

    // Consolidate: group by referencia+bodega, sum quantities
    // Each group has _items[] (originals) and cant_total (sum)
    const groupMap = {};
    allRaw.forEach(it => {
      // Incluir CO en la clave para evitar mezcla entre centros de operación
      const gk = it.referencia + '|' + it.bodega + '|' + it._tipo + '|' + (it.co || G.co.id);
      if (!groupMap[gk]) {
        groupMap[gk] = {
          ...it,
          cant_total: 0,
          cant_alistada_total: 0,
          _items: [],
          // Group estado: completo only if ALL done, parcial if some done, else pendiente
          estado_prep: 'pendiente',
        };
      }
      groupMap[gk].cant_total += (parseFloat(it.cant_comprometida) || 0);
      groupMap[gk].cant_alistada_total += (parseFloat(it.cant_alistada) || 0);
      groupMap[gk]._items.push(it);
    });

    // Compute group estado_prep
    Object.values(groupMap).forEach(g => {
      const total = g._items.length;
      const comp  = g._items.filter(i => i.estado_prep === 'completo').length;
      const parc  = g._items.filter(i => i.estado_prep === 'parcial').length;
      if (comp === total) g.estado_prep = 'completo';
      else if (comp > 0 || parc > 0) g.estado_prep = 'parcial';
      else g.estado_prep = 'pendiente';
    });

    _alItems = Object.values(groupMap).sort((a,b) => a._seq - b._seq);
    uld();
    pgAlistadorHome();
  } catch(err) { uld(); toast('Error: ' + err.message, 'er'); }
}

function aplicarFiltrosYMostrarZonas() {
  const filtZonaLog  = document.getElementById('filtZonaLog')?.value  || '';
  const filtZonaPick = document.getElementById('filtZonaPick')?.value || '';
  const filtBodega   = document.getElementById('filtBodega')?.value   || '';
  const filtPed      = document.getElementById('filtPed')?.checked  !== false;
  const filtReq      = document.getElementById('filtReq')?.checked  !== false;

  if (!filtPed && !filtReq) { toast('Selecciona al menos un tipo de documento', 'wa'); return; }

  // Guardar filtros activos globalmente
  window._alFiltros = { zonaLog: filtZonaLog, zonaPick: filtZonaPick, bodega: filtBodega, ped: filtPed, req: filtReq };

  // Filtrar items
  let items = _alItems;
  if (filtZonaLog)  items = items.filter(i => (i.zona_logistica||'') === filtZonaLog);
  if (filtZonaPick) items = items.filter(i => (i._zona||'SIN ZONA') === filtZonaPick);
  if (filtBodega)   items = items.filter(i => i.bodega === filtBodega);
  if (!filtPed)     items = items.filter(i => i._tipo !== 'pedidos');
  if (!filtReq)     items = items.filter(i => i._tipo !== 'requisiciones');

  if (!items.length) { toast('No hay ítems con los filtros seleccionados', 'wa'); return; }

  // Guardar items filtrados para el picking
  window._alItemsFiltrados = items;
  pgMostrarZonas(items);
}

// ── Pantalla: lista de zonas filtradas ───────────────────────────
function pgMostrarZonas(items) {
  $fab.style.display = 'none';
  const f = window._alFiltros || {};

  const total = items.length;
  const compl = items.filter(i => i.estado_prep === 'completo').length;
  const parc  = items.filter(i => i.estado_prep === 'parcial').length;
  const pct   = total ? Math.round((compl+parc)/total*100) : 0;

  // Agrupar por zona ordenado por secuencia
  const zonas = {};
  items.forEach(i => {
    const z = i._zona || 'SIN ZONA';
    if (!zonas[z]) zonas[z] = { total: 0, done: 0, seq: i._seq || 9999 };
    zonas[z].total++;
    if (i.estado_prep === 'completo' || i.estado_prep === 'parcial') zonas[z].done++;
  });
  const zonaList = Object.entries(zonas).sort((a,b) => a[1].seq - b[1].seq);

  // Chips de filtros activos
  const chips = [];
  if (f.zonaLog)  chips.push('📍 ' + f.zonaLog);
  if (f.zonaPick) chips.push('🗺 ' + f.zonaPick);
  if (f.bodega)   chips.push('🏪 ' + f.bodega);
  if (f.ped && !f.req)   chips.push('📦 Solo pedidos');
  if (f.req && !f.ped)   chips.push('🔄 Solo requisiciones');
  const chipsHtml = chips.length
    ? '<div style="padding:4px 14px;display:flex;gap:6px;flex-wrap:wrap">'
      + chips.map(ch => '<span class="badge b-gray" style="font-size:11px">' + e(ch) + '</span>').join('')
      + '</div>'
    : '';

  let html = '<div class="hdr">'
    + '<button class="hdr-btn" onclick="pgAlistadorHome()">← Filtros</button>'
    + '<div style="flex:1"><div style="font-weight:700;font-size:15px">🗺 Zonas de picking</div>'
    + '<div style="font-size:11px;opacity:.85">' + total + ' refs · ' + pct + '% avance</div></div>'
    + '<button class="hdr-btn" onclick="abrirBuscador()" style="background:rgba(255,255,255,.15)">🔍</button>'
    + '</div>'
    + chipsHtml
    + '<div style="padding:4px 14px 2px"><div class="prog-bg" style="height:8px">'
    + '<div class="prog-fill" style="width:' + pct + '%"></div></div></div>';

  if (zonaList.length === 0) {
    html += '<div class="card" style="text-align:center;color:var(--mut)">Sin zonas para los filtros seleccionados.</div>';
  }

  zonaList.forEach(([zona, info]) => {
    const zPct   = info.total ? Math.round(info.done/info.total*100) : 0;
    const allDone = info.done === info.total;
    html += '<div class="list-item" style="' + (allDone?'opacity:.6':'') + '" onclick="iniciarCadenaFiltrada(\'' + encodeURIComponent(zona) + '\')">'
      + '<div class="li-icon">' + (allDone ? '✅' : '📦') + '</div>'
      + '<div class="li-body">'
      + '<div class="li-name">' + e(zona) + '</div>'
      + '<div class="li-sub">' + info.total + ' referencias · ' + zPct + '%</div>'
      + '<div class="prog-bg" style="height:4px;margin-top:4px"><div class="prog-fill" style="width:' + zPct + '%"></div></div>'
      + '</div><div class="li-arr">›</div></div>';
  });

  rdr(html);
}

// Inicia cadena usando los items filtrados
function iniciarCadenaFiltrada(zonaEnc) {
  const zona = decodeURIComponent(zonaEnc);
  _alZona = zona;
  const items = (window._alItemsFiltrados || _alItems)
    .filter(i => (i._zona || 'SIN ZONA') === zona)
    .sort((a,b) => (a._seq||9999) - (b._seq||9999));
  if (!items.length) { toast('Sin ítems en esta zona', 'wa'); return; }
  _chainItems = items;
  if (_chainItems.every(i => i.estado_prep === 'completo')) {
    toast('✅ Zona ya completada', 'ok');
    return;
  }
  const first = _chainItems.findIndex(i => i.estado_prep !== 'completo');
  pgPickingItem(first >= 0 ? first : 0);
}

async function confirmarGrupo(gKeyEnc, estado) {
  document.getElementById('itmModal')?.remove();
  const gKey = decodeURIComponent(gKeyEnc);
  const group = _alItems.find(i => (i.referencia+'|'+i.bodega+'|'+i._tipo+'|'+(i.co||G.co.id)) === gKey);
  if (!group) return;
  ld('Guardando...');
  try {
    for (const item of group._items) {
      const upd = estado === 'completo'
        ? { estado_prep: 'completo', cant_alistada: item.cant_comprometida, motivo: null }
        : { estado_prep: 'pendiente', cant_alistada: null, motivo: null };
      await sb.from(item._tipo).update(upd).eq('id', item.id);
      Object.assign(item, upd);
    }
    // Update group estado
    group.estado_prep = estado;
    if (estado === 'completo') { group.cant_alistada_total = group.cant_total; group.motivo = null; }
    else { group.cant_alistada_total = 0; group.motivo = null; }
    uld(); toast(estado === 'completo' ? '✅ Completo' : '↩ Deshecho');
    pgZonaItems(encodeURIComponent(_alZona));
  } catch(e) { uld(); toast('Error: ' + e.message, 'er'); }
}

async function saveParcial(gKeyEnc) {
  const qty    = parseFloat(document.getElementById('parQty').value) || 0;
  const motivo = document.getElementById('parMotivo').value;
  const nota   = document.getElementById('parNota').value;
  document.getElementById('parModal')?.remove();
  const gKey = decodeURIComponent(gKeyEnc);
  const group = _alItems.find(i => (i.referencia+'|'+i.bodega+'|'+i._tipo+'|'+(i.co||G.co.id)) === gKey);
  if (!group) return;
  const m = motivo + (nota ? ': ' + nota : '');
  ld('Guardando...');
  try {
    // Distribute qty proportionally across items
    let remaining = qty;
    for (let idx = 0; idx < group._items.length; idx++) {
      const it = group._items[idx];
      const isLast = idx === group._items.length - 1;
      const itQty = isLast ? remaining : Math.min(remaining, it.cant_comprometida || 0);
      const upd = { estado_prep: 'parcial', cant_alistada: itQty, motivo: m || null };
      await sb.from(it._tipo).update(upd).eq('id', it.id);
      Object.assign(it, upd);
      remaining = Math.max(0, remaining - itQty);
    }
    group.estado_prep = 'parcial';
    group.cant_alistada_total = qty;
    group.motivo = m || null;
    uld(); toast('⏳ Guardado como parcial');
    pgZonaItems(encodeURIComponent(_alZona));
  } catch(e) { uld(); toast('Error: ' + e.message, 'er'); }
}


// ── Selección y eliminación de filas ────────────────────────
function toggleSelAll(prefix, checked) {
  document.querySelectorAll('.' + prefix + '-sel').forEach(cb => { cb.checked = checked; });
}

async function eliminarSeleccionados(prefix, tabla) {
  const cb = tabla === 'pedidos' ? pgTablaPedidos
           : tabla === 'requisiciones' ? pgTablaRequisiciones
           : tabla === 'kits' ? pgTablaKits
           : tabla === 'bodegas' ? pgTablaBodegas
           : tabla === 'usuarios' ? pgTablaUsuarios
           : null;
  await eliminarSeleccionadosGen(prefix, tabla, cb);
}
async function eliminarSeleccionadosGen(prefix, tabla, callback) {
  const checks = [...document.querySelectorAll('.' + prefix + '-sel:checked')];
  if (!checks.length) { toast('No hay filas seleccionadas', 'wa'); return; }
  if (!confirm('¿Eliminar ' + checks.length + ' fila(s) seleccionada(s)?')) return;
  const ids = checks.map(cb => cb.dataset.id);
  ld('Eliminando ' + ids.length + ' registros...');
  let ok = 0, errs = 0;
  for (const id of ids) {
    try { await sb.from(tabla).delete().eq('id', id); ok++; }
    catch { errs++; }
  }
  uld();
  toast(errs ? ok + ' eliminados, ' + errs + ' errores' : '✅ ' + ok + ' registros eliminados', errs ? 'wa' : 'ok');
  if (callback) callback();
}

function filtrarLog() {
  const t = document.getElementById('lf1')?.value.toLowerCase() || '';
  const u = document.getElementById('lf2')?.value.toLowerCase() || '';
  const s = document.getElementById('lf3')?.value || '';
  const data = (window._logRows || []).filter(r =>
    (!t || String(r.tabla||'').toLowerCase().includes(t)) &&
    (!u || String(r.usuario_nombre||'').toLowerCase().includes(u)) &&
    (!s || r.estado === s)
  );
  const cls = {'exito':'b-ok','error':'b-er','parcial':'b-wa'};
  const ico = {'exito':'✅','error':'❌','parcial':'⚠️'};
  const tbody = document.getElementById('logTbody');
  if (!tbody) return;
  tbody.innerHTML = data.map(r =>
    '<tr>' +
    '<td style="white-space:nowrap;font-size:11px">' + e(String(r.fecha_hora||'').replace('T',' ').substring(0,19)) + '</td>' +
    '<td><span class="badge b-gray">' + e(String(r.tabla||'')) + '</span></td>' +
    '<td>' + e(String(r.co||'')) + '</td>' +
    '<td style="text-align:right;color:var(--ok);font-weight:700">' + fmtn(r.filas_importadas) + '</td>' +
    '<td style="text-align:right;color:' + (r.filas_error > 0 ? 'var(--er)' : 'var(--mut)') + ';font-weight:700">' + fmtn(r.filas_error||0) + '</td>' +
    '<td><span class="badge ' + (cls[r.estado]||'b-gray') + '">' + (ico[r.estado]||'') + ' ' + e(String(r.estado||'')) + '</span></td>' +
    '<td>' + e(String(r.usuario_nombre||'')) + '</td>' +
    '<td style="font-size:11px;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--er)" title="' + e(String(r.desc_error||'')) + '">' + e(String(r.desc_error||r.detalle||'')) + '</td>' +

async function saveParcialConCantidad(gKeyEnc, cantConf) {
  const motivo = document.getElementById('parMotivo').value;
  if (!motivo) { toast('Selecciona un motivo', 'wa'); return; }
  const nota = document.getElementById('parNota').value;
  document.getElementById('parModal')?.remove();
  // Reutiliza saveParcial setting qty manually
  const gKey = decodeURIComponent(gKeyEnc);
  const group = _alItems.find(i=>(i.referencia+'|'+i.bodega+'|'+i._tipo+'|'+(i.co||G.co.id))===gKey);
  if (!group) return;
  const m = motivo + (nota ? ': '+nota : '');
  ld('Guardando...');
  try {
    let remaining = cantConf;
    for (let idx = 0; idx < group._items.length; idx++) {
      const it = group._items[idx];
      const isLast = idx === group._items.length-1;
      const itQty = isLast ? remaining : Math.min(remaining, it.cant_comprometida||0);
      const upd = { estado_prep:'parcial', cant_alistada:itQty, motivo:m };
      await sb.from(it._tipo).update(upd).eq('id', it.id);
      Object.assign(it, upd);
      remaining = Math.max(0, remaining-itQty);
    }
    group.estado_prep = 'parcial'; group.cant_alistada_total = cantConf; group.motivo = m;
    uld(); toast('⏳ Guardado como parcial: '+fmtn(cantConf)+' '+e(String(group.um_emp||group.um||'')));
    pgZonaItems(encodeURIComponent(_alZona));
  } catch(err) { uld(); toast('Error: '+err.message,'er'); }
}



// ── UM display helpers ───────────────────────────────────────────
function umDesglose(cant, um) {
  const f = factorUM(um);
  if (f <= 1 || !cant) return '';
  const cajas   = Math.floor(cant / f);
  const sueltas = Math.round((cant % f) * 100) / 100;
  let txt = '';
  if (cajas > 0)   txt += '<strong>' + fmtn(cajas) + '</strong> caja' + (cajas !== 1 ? 's' : '');
  if (cajas > 0 && sueltas > 0) txt += ' + ';
  if (sueltas > 0) txt += '<strong>' + fmtn(sueltas) + '</strong> und sueltas';
  return '<div style="font-size:13px;color:var(--mut);margin-top:4px">' + txt + '</div>';
}

function buildCantInputs(cantTotal, um) {
  const f = factorUM(um);
  const { cajas, sueltas } = aCajasYSueltas(cantTotal, um);

  if (f <= 1) {
    // Sin empaque: campo único en unidades
    return '<div style="font-size:12px;font-weight:700;color:var(--mut);margin-bottom:4px">📦 CANTIDAD ALISTADA (unidades)</div>'
      + '<input id="cantConfirm" class="scan-inp" type="number" min="0" max="' + cantTotal + '"'
      + ' value="' + cantTotal + '" style="font-size:26px;font-weight:900;text-align:center"'
      + ' data-factor="1" data-max="' + cantTotal + '" />';
  }

  // Con empaque: dos campos — cajas y sueltas
  return '<div style="font-size:12px;font-weight:700;color:var(--mut);margin-bottom:6px">📦 CANTIDAD ALISTADA</div>'
    + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">'
    + '<div>'
    + '<div style="font-size:11px;text-align:center;color:var(--mut);margin-bottom:3px">Cajas (' + e(um) + ')</div>'
    + '<input id="cantCajas" class="scan-inp" type="number" min="0" max="' + cajas + '"'
    + ' value="' + cajas + '" style="font-size:22px;font-weight:900;text-align:center"'
    + ' data-factor="' + f + '" data-max-cajas="' + cajas + '" data-max-total="' + cantTotal + '"'
    + ' oninput="sincronizarCajas(this)" />'
    + '</div>'
    + '<div>'
    + '<div style="font-size:11px;text-align:center;color:var(--mut);margin-bottom:3px">Und. sueltas</div>'
    + '<input id="cantSueltas" class="scan-inp" type="number" min="0" max="' + (f-1) + '"'
    + ' value="' + sueltas + '" style="font-size:22px;font-weight:900;text-align:center"'
    + ' data-factor="' + f + '" data-max-total="' + cantTotal + '"'
    + ' oninput="sincronizarSueltas(this)" />'
    + '</div>'
    + '</div>'
    // Campo oculto que siempre tiene el total en unidades
    + '<input type="hidden" id="cantConfirm" value="' + cantTotal + '" data-factor="' + f + '" data-max="' + cantTotal + '"/>'
    + '<div id="cantResumen" style="font-size:12px;text-align:center;color:var(--mut);margin-top:6px">'
    + 'Total: <strong>' + fmtn(cantTotal) + '</strong> unidades</div>';
}

function sincronizarCajas(inp) {
  const f       = parseFloat(inp.dataset.factor) || 1;
  const maxT    = parseFloat(inp.dataset.maxTotal) || 0;
  const cajas   = Math.max(0, parseFloat(inp.value) || 0);
  const sInp    = document.getElementById('cantSueltas');
  const hidden  = document.getElementById('cantConfirm');
  const resumen = document.getElementById('cantResumen');
  const sueltas = Math.max(0, parseFloat(sInp?.value) || 0);
  const total   = cajas * f + sueltas;
  if (hidden)  hidden.value = total;
  if (resumen) resumen.innerHTML = 'Total: <strong>' + fmtn(total) + '</strong> unidades'
    + (total > maxT ? ' <span style="color:var(--er)">⚠️ excede ' + fmtn(maxT) + '</span>' : '');
  pickingValidarCant();
}

function sincronizarSueltas(inp) {
  const f       = parseFloat(inp.dataset.factor) || 1;
  const maxT    = parseFloat(inp.dataset.maxTotal) || 0;
  const sueltas = Math.max(0, parseFloat(inp.value) || 0);
  const cInp    = document.getElementById('cantCajas');
  const hidden  = document.getElementById('cantConfirm');
  const resumen = document.getElementById('cantResumen');
  const cajas   = Math.max(0, parseFloat(cInp?.value) || 0);
  const total   = cajas * f + sueltas;
  if (hidden)  hidden.value = total;
  if (resumen) resumen.innerHTML = 'Total: <strong>' + fmtn(total) + '</strong> unidades'
    + (total > maxT ? ' <span style="color:var(--er)">⚠️ excede ' + fmtn(maxT) + '</span>' : '');
  pickingValidarCant();
}

function pgPickingItem(idx) {
  _chainIdx = idx;
  const item = _chainItems[idx];
  if (!item) { pgZonaItems(encodeURIComponent(_alZona)); return; }

  const total    = _chainItems.length;
  const hechos   = _chainItems.filter(i => i.estado_prep === 'completo').length;
  const pct      = total ? Math.round(hechos / total * 100) : 0;
  const isDone   = item.estado_prep === 'completo';
  const isParcial= item.estado_prep === 'parcial';
  const cantTotal= item.cant_total || item.cant_comprometida || 0;
  const um       = e(String(item.um_emp || item.um || 'UND'));
  const kits     = _kitsMap[String(item.referencia)] || [];
  const showKits = kits.length > 0 && item._desglosar;
  const hasPrev  = idx > 0;
  const hasNext  = idx < total - 1;
  const nextPend = _chainItems.findIndex((it, i) => i > idx && it.estado_prep !== 'completo');
  const tipoTag  = item._tipo === 'pedidos'
    ? '<span class="badge b-pr" style="font-size:10px">PED</span>'
    : '<span class="badge b-vio" style="font-size:10px">REQ</span>';

  // Store in global so all handlers can access without passing args
  window._pickingItem   = item;
  window._pickingIdx    = idx;
  window._pickingCanMax = cantTotal;

  // Kit breakdown
  let kitHtml = '';
  if (showKits) {
    kitHtml = '<div class="kit-box" style="margin:8px 0"><div style="font-weight:700;color:var(--gold);margin-bottom:4px">🎁 Componentes:</div>';
    kits.forEach(k => {
      kitHtml += '<div class="kit-row"><span>' + e(k.ref) + ' — ' + e(k.desc||'') + '</span>'
        + '<span style="font-weight:700">' + fmtn(k.qty * cantTotal) + ' ' + um + '</span></div>';
    });
    kitHtml += '</div>';
  }

  const estadoBadge = isDone
    ? '<span class="badge b-ok" style="font-size:13px">✅ Completo</span>'
    : isParcial
    ? '<span class="badge b-wa" style="font-size:13px">⏳ Parcial: ' + fmtn(item.cant_alistada_total||0) + ' ' + um + '</span>'
    : '';

  // ── Build HTML ───────────────────────────────────────────────
  let html = '';

  // Header
  html += '<div class="hdr">'
    + '<button class="hdr-btn" onclick="pgZonaItems(encodeURIComponent(_alZona))">← Lista</button>'
    + '<div style="flex:1;text-align:center">'
    + '<div style="font-size:11px;opacity:.8">' + e(_alZona) + ' &nbsp;·&nbsp; ' + (idx+1) + '/' + total + '</div>'
    + '<div style="font-size:11px;opacity:.7">' + pct + '% completado</div>'
    + '</div>'
    + '<div id="zonaTimerDisplay" class="timer-box">⏱ 0 min</div>'
    + '</div>';

  // Progress
  html += '<div style="padding:4px 14px 0"><div class="prog-bg" style="height:6px">'
    + '<div class="prog-fill" style="width:' + pct + '%"></div></div></div>';

  // Item card
  html += '<div class="confirm-step">'
    + '<div class="confirm-seq">SEC. ' + (item._seq || '—') + ' &nbsp;·&nbsp; ' + e(item.bodega||'') + ' &nbsp;' + tipoTag + '</div>'
    + '<div class="confirm-ref">' + e(String(item.referencia)) + '</div>'
    + '<div class="confirm-desc">' + e(String(item.desc_item||'—')) + '</div>'
    + kitHtml
    + '<div style="text-align:center;margin:10px 0">'
    + '<div style="font-size:11px;color:var(--mut);margin-bottom:2px">CANTIDAD A PREPARAR</div>'
    + '<div class="confirm-cant">' + fmtn(cantTotal) + ' <span style="font-size:20px">' + e(item.um_emp||item.um||'UND') + '</span></div>'
    + umDesglose(cantTotal, item.um_emp||item.um||'')
    + '</div>'
    + (estadoBadge ? '<div style="text-align:center;margin-bottom:8px">' + estadoBadge + '</div>' : '')
    + '</div>';

  // Confirmation inputs (only when not done)
  if (!isDone) {
    html += '<div style="padding:0 14px">'
      + '<div style="font-size:12px;font-weight:700;color:var(--mut);margin-bottom:4px">🔍 CONFIRMAR REFERENCIA</div>'
      + '<input id="scanRef" class="scan-inp" type="text"'
      + ' placeholder="Escanea o escribe la referencia..."'
      + ' autocomplete="off" autocorrect="off" spellcheck="false" />'
      + '<div id="refFeedback" style="font-size:12px;text-align:center;height:18px;margin-top:2px"></div>'
      + '</div>'
      + '<div id="cantSeccion" style="display:none;padding:0 14px;margin-top:6px">'
      + buildCantInputs(cantTotal, item.um_emp||item.um||'')
      + '<div id="cantFeedback" style="font-size:12px;text-align:center;margin-top:4px;min-height:18px"></div>'
      + '</div>';
  }

  // Navigation buttons
  html += '<div class="chain-nav">'
    + (hasPrev
      ? '<button class="btn btn-sec btn-sm" style="flex:1" onclick="pgPickingItem(' + (idx-1) + ')">← Ant.</button>'
      : '<div style="flex:1"></div>')
    + (isDone
      ? '<button class="btn btn-sm" style="flex:2;background:var(--ok);color:#fff"'
        + ' onclick="pgPickingItem(' + (nextPend >= 0 ? nextPend : idx+1) + ')">'
        + (nextPend >= 0 ? 'Siguiente →' : '✅ Fin zona') + '</button>'
      : '<button class="btn btn-sm" style="flex:2;background:var(--gold);color:var(--pr);font-weight:700"'
        + ' id="btnConfirmar" onclick="pickingConfirmar()">✅ Confirmar</button>')
    + (hasNext
      ? '<button class="btn btn-sec btn-sm" style="flex:1" onclick="pgPickingItem(' + (idx+1) + ')">Sal. →</button>'
      : '<div style="flex:1"></div>')
    + '</div>';

  // Undo button if done/parcial
  if (isDone || isParcial) {
    html += '<div style="padding:0 14px 10px">'
      + '<button class="btn btn-sec" onclick="pickingDeshacer()">↩ Deshacer</button>'
      + '</div>';
  }

  rdr(html);

  // Attach event listeners AFTER render (no inline handlers needed)
  if (!isDone) {
    const refInp  = document.getElementById('scanRef');
    const cantInp = document.getElementById('cantConfirm');

    refInp.addEventListener('input', () => pickingValidarRef());
    refInp.addEventListener('keydown', pickingRefKeydown);

    // Attach to all quantity inputs (single OR cajas+sueltas)
    const cantInputs = [
      document.getElementById('cantConfirm'),
      document.getElementById('cantCajas'),
      document.getElementById('cantSueltas'),
    ].filter(Boolean);
    cantInputs.forEach(inp => {
      if (inp.type !== 'hidden') {
        inp.addEventListener('input', () => pickingValidarCant());
        inp.addEventListener('keydown', pickingCantKeydown);
      }
    });

    setTimeout(() => { refInp.focus(); }, 150);
  }
}
