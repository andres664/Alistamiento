function _pi()   { return window._pickingItem; }
function _piMax(){ return window._pickingCanMax || 0; }
function _piIdx(){ return window._pickingIdx || 0; }

// ── Validar referencia ───────────────────────────────────────────
function pickingValidarRef() {
  const inp = document.getElementById('scanRef');
  const fb  = document.getElementById('refFeedback');
  const sec = document.getElementById('cantSeccion');
  if (!inp) return;
  const val = inp.value.trim().toUpperCase();
  const ref = String(_pi()?.referencia || '').trim().toUpperCase();
  if (!val) {
    inp.className = 'scan-inp';
    fb.textContent = '';
    sec.style.display = 'none';
    return;
  }
  if (val === ref) {
    inp.className = 'scan-inp ok';
    fb.innerHTML = '<span style="color:var(--ok);font-weight:700">✅ Referencia correcta</span>';
    sec.style.display = 'block';
    setTimeout(() => {
      const c = document.getElementById('cantConfirm');
      if (c) { c.focus(); c.select(); }
    }, 100);
  } else if (ref.startsWith(val)) {
    inp.className = 'scan-inp';
    fb.innerHTML = '<span style="color:var(--wa)">Sigue escribiendo...</span>';
    sec.style.display = 'none';
  } else {
    inp.className = 'scan-inp er';
    fb.innerHTML = '<span style="color:var(--er);font-weight:700">❌ Referencia incorrecta</span>';
    sec.style.display = 'none';
  }
}

// ── Validar cantidad ─────────────────────────────────────────────
function pickingValidarCant() {
  const hidden = document.getElementById('cantConfirm');
  const fb     = document.getElementById('cantFeedback');
  if (!hidden) return;
  const val = parseFloat(hidden.value) || 0;
  const max = _piMax();
  const item = _pi();
  const um   = item?.um_emp || item?.um || '';
  const f    = factorUM(um);
  // Update visual on single input if present
  const singleInp = document.getElementById('cantConfirm');
  if (singleInp && singleInp.type === 'number') {
    singleInp.className = val > max ? 'scan-inp er' : val === max ? 'scan-inp ok' : val > 0 ? 'scan-inp' : 'scan-inp';
  }
  if (!fb) return;
  if (val > max) {
    fb.innerHTML = '<span style="color:var(--er);font-weight:700">❌ Máximo: ' + fmtCantUM(max,um) + '</span>';
  } else if (val === max) {
    fb.innerHTML = '<span style="color:var(--ok);font-weight:700">✅ Cantidad completa</span>';
  } else if (val > 0) {
    const falt = max - val;
    fb.innerHTML = '<span style="color:var(--wa)">⚠️ Parcial — faltan ' + fmtCantUM(falt,um) + '</span>';
  } else {
    fb.textContent = '';
  }
}

// ── Teclados ─────────────────────────────────────────────────────
function pickingRefKeydown(event) {
  const sec = document.getElementById('cantSeccion');
  if (event.key === 'Escape') { event.preventDefault(); pgZonaItems(encodeURIComponent(_alZona)); }
  if (event.key === 'Enter') {
    event.preventDefault();
    if (sec && sec.style.display !== 'none') {
      const c = document.getElementById('cantConfirm');
      if (c) { c.focus(); c.select(); }
    } else {
      // Try to validate first
      pickingValidarRef();
      setTimeout(() => {
        const sec2 = document.getElementById('cantSeccion');
        if (sec2 && sec2.style.display !== 'none') {
          const c = document.getElementById('cantConfirm');
          if (c) { c.focus(); c.select(); }
        }
      }, 50);
    }
  }
}

function pickingCantKeydown(event) {
  if (event.key === 'Escape') {
    event.preventDefault();
    const sec = document.getElementById('cantSeccion');
    const ref = document.getElementById('scanRef');
    if (sec) sec.style.display = 'none';
    if (ref) { ref.value = ''; ref.className = 'scan-inp'; ref.focus(); }
    const fb = document.getElementById('refFeedback');
    if (fb) fb.textContent = '';
  }
  if (event.key === 'Enter') {
    event.preventDefault();
    // Si hay campo sueltas y el foco está en cajas, saltar a sueltas
    const sueltas = document.getElementById('cantSueltas');
    if (sueltas && event.target.id === 'cantCajas') {
      sueltas.focus(); sueltas.select(); return;
    }
    pickingConfirmar();
  }
}

// ── Confirmar ítem ───────────────────────────────────────────────
function pickingConfirmar() {
  const refInp  = document.getElementById('scanRef');
  const cantInp = document.getElementById('cantConfirm');
  const sec     = document.getElementById('cantSeccion');
  const item    = _pi();
  if (!item) return;

  // 1. Verificar referencia
  const refVal = (refInp?.value || '').trim().toUpperCase();
  const refEsp = String(item.referencia).trim().toUpperCase();
  if (refVal !== refEsp) {
    toast('Escribe o escanea la referencia primero', 'wa');
    refInp?.focus();
    return;
  }
  // 2. Verificar que cantSeccion está visible
  if (!sec || sec.style.display === 'none') {
    toast('Confirma la referencia primero', 'wa');
    return;
  }
  // 3. Leer cantidad
  const cantVal = parseFloat(cantInp?.value) || 0;
  const cantMax = _piMax();
  if (cantVal > cantMax) { toast('❌ No puedes confirmar más de ' + fmtn(cantMax), 'er'); cantInp?.focus(); return; }
  if (cantVal <= 0)       { toast('Ingresa una cantidad mayor a 0', 'wa'); cantInp?.focus(); return; }

  if (cantVal >= cantMax) {
    pickingGuardar('completo', cantMax, null);
  } else {
    pickingAbrirMotivo(cantVal, cantMax);
  }
}

// ── Guardar en BD ────────────────────────────────────────────────
async function pickingGuardar(estado, cantConf, motivo) {
  const item  = _pi();
  const idx   = _piIdx();
  const gKey  = item.referencia + '|' + item.bodega + '|' + item._tipo + '|' + (item.co || G.co.id);
  const group = _alItems.find(i => (i.referencia+'|'+i.bodega+'|'+i._tipo+'|'+(i.co||G.co.id)) === gKey);
  if (!group) return;
  ld('Guardando...');
  try {
    if (estado === 'completo') {
      for (const it of group._items) {
        await sb.from(it._tipo).update({ estado_prep:'completo', cant_alistada:it.cant_comprometida, motivo:null }).eq('id', it.id);
        Object.assign(it, { estado_prep:'completo', cant_alistada:it.cant_comprometida, motivo:null });
      }
      group.estado_prep = 'completo'; group.cant_alistada_total = group.cant_total; group.motivo = null;
    } else {
      let rem = cantConf;
      for (let i = 0; i < group._items.length; i++) {
        const it = group._items[i];
        const isLast = i === group._items.length - 1;
        const q = isLast ? rem : Math.min(rem, it.cant_comprometida || 0);
        await sb.from(it._tipo).update({ estado_prep:'parcial', cant_alistada:q, motivo }).eq('id', it.id);
        Object.assign(it, { estado_prep:'parcial', cant_alistada:q, motivo });
        rem = Math.max(0, rem - q);
      }
      group.estado_prep = 'parcial'; group.cant_alistada_total = cantConf; group.motivo = motivo;
    }
    // Sync _chainItems
    const ci = _chainItems[idx];
    if (ci) { ci.estado_prep = estado; ci.cant_alistada_total = cantConf; ci.motivo = motivo; }
    uld();
    toast(estado === 'completo' ? '✅ Preparado' : '⏳ Parcial registrado', estado === 'completo' ? 'ok' : 'wa');
    // Auto-avanzar
    const nextPend = _chainItems.findIndex((it, i) => i > idx && it.estado_prep !== 'completo');
    if (nextPend >= 0) {
      setTimeout(() => pgPickingItem(nextPend), 300);
    } else {
      setTimeout(() => { toast('🎉 ¡Zona completada!', 'ok'); pgZonaItems(encodeURIComponent(_alZona)); }, 500);
    }
  } catch(err) { uld(); toast('Error: ' + err.message, 'er'); }
}

// ── Deshacer ─────────────────────────────────────────────────────
async function pickingDeshacer() {
  const item  = _pi();
  const idx   = _piIdx();
  const gKey  = item.referencia + '|' + item.bodega + '|' + item._tipo + '|' + (item.co || G.co.id);
  const group = _alItems.find(i => (i.referencia+'|'+i.bodega+'|'+i._tipo+'|'+(i.co||G.co.id)) === gKey);
  if (!group) return;
  ld('Deshaciendo...');
  try {
    for (const it of group._items) {
      await sb.from(it._tipo).update({ estado_prep:'pendiente', cant_alistada:null, motivo:null }).eq('id', it.id);
      Object.assign(it, { estado_prep:'pendiente', cant_alistada:null, motivo:null });
    }
    group.estado_prep = 'pendiente'; group.cant_alistada_total = 0; group.motivo = null;
    const ci = _chainItems[idx];
    if (ci) { ci.estado_prep = 'pendiente'; ci.cant_alistada_total = 0; ci.motivo = null; }
    uld(); toast('↩ Deshecho');
    pgPickingItem(idx);
  } catch(err) { uld(); toast('Error: ' + err.message, 'er'); }
}

// ── Modal motivo (cantidad parcial) ──────────────────────────────
function pickingAbrirMotivo(cantConf, cantMax) {
  const item = _pi();
  const um   = e(String(item?.um_emp || item?.um || 'UND'));
  const modal = document.createElement('div');
  modal.id = 'motivoModal';
  modal.className = 'overlay';
  modal.style.display = 'flex';
  modal.innerHTML = '<div class="modal">'
    + '<div class="modal-hdl"></div>'
    + '<div style="font-weight:700;font-size:15px;margin-bottom:8px">⚠️ Cantidad parcial</div>'
    + '<div style="background:var(--wa-l);padding:10px;border-radius:8px;text-align:center;margin-bottom:12px">'
    + 'Alistado: <strong style="font-size:18px">' + fmtn(cantConf) + '</strong> de <strong>' + fmtn(cantMax) + '</strong> ' + um
    + '<br><span style="font-size:11px;color:var(--wa)">Faltante: ' + fmtn(cantMax - cantConf) + ' ' + um + '</span>'
    + '</div>'
    + '<span class="inp-label">Motivo (obligatorio)</span>'
    + '<select id="motivoSel" class="inp">'
    + '<option value="">Selecciona motivo...</option>'
    + '<option>Sin stock suficiente</option>'
    + '<option>Producto dañado</option>'
    + '<option>No ubicado</option>'
    + '<option>Fecha vencida</option>'
    + '<option>Error en cantidad pedida</option>'
    + '<option>Producto en cuarentena</option>'
    + '<option>Otro</option>'
    + '</select>'
    + '<input id="motivoNota" class="inp" placeholder="Nota adicional (opcional)" style="margin-top:6px"/>'
    + '<div style="display:flex;gap:8px;margin-top:12px">'
    + '<button class="btn btn-sec" style="flex:1" id="btnCancelarMotivo">Cancelar</button>'
    + '<button class="btn btn-wa" style="flex:1" id="btnGuardarMotivo">Guardar</button>'
    + '</div></div>';

  document.body.appendChild(modal);
  modal.querySelector('#btnCancelarMotivo').onclick = () => modal.remove();
  modal.querySelector('#btnGuardarMotivo').onclick  = () => pickingGuardarMotivo(cantConf, cantMax);
  modal.onclick = ev => { if (ev.target === modal) modal.remove(); };

  const sel = modal.querySelector('#motivoSel');
  sel.focus();
  sel.addEventListener('keydown', ev => {
    if (ev.key === 'Enter') { ev.preventDefault(); pickingGuardarMotivo(cantConf, cantMax); }
    if (ev.key === 'Escape') { ev.preventDefault(); modal.remove(); }
  });
  modal.querySelector('#motivoNota').addEventListener('keydown', ev => {
    if (ev.key === 'Enter') { ev.preventDefault(); pickingGuardarMotivo(cantConf, cantMax); }
    if (ev.key === 'Escape') { ev.preventDefault(); modal.remove(); }
  });
}

function pickingGuardarMotivo(cantConf, cantMax) {
  const motivo = document.getElementById('motivoSel')?.value;
  const nota   = document.getElementById('motivoNota')?.value || '';
  if (!motivo) { toast('Selecciona un motivo', 'wa'); return; }
  document.getElementById('motivoModal')?.remove();
  const m = motivo + (nota ? ': ' + nota : '');
  pickingGuardar('parcial', cantConf, m);
}

// TECLADO GLOBAL: Enter y Escape para navegación
// ═══════════════════════════════════════════════════════════════
document.addEventListener('keydown', function(e) {
  // Solo actuar si no hay un input activo específico con su propio handler
  const active = document.activeElement;
  const tagName = active?.tagName?.toLowerCase();
  const hasHandler = active?.dataset?.kbhandler;
  if (hasHandler) return; // El input tiene su propio handler

  if (e.key === 'Escape') {
    e.preventDefault();
    // Cerrar modal abierto si hay
    const overlay = document.querySelector('.overlay[style*="flex"]');
    if (overlay) { overlay.remove(); return; }
    // Cerrar búsqueda o scanner
    const buscador = document.getElementById('buscadorOverlay');
    if (buscador) { cerrarBuscador(); return; }
    const scanner = document.getElementById('scanOverlay');
    if (scanner) { cerrarEscaner(); return; }
    // Si está en pgPickingItem, volver a lista zona
    if (_alZona && document.getElementById('zonaTimerDisplay') && document.querySelector('.confirm-step')) {
      pgZonaItems(encodeURIComponent(_alZona)); return;
    }
  }

  // Enter en login
  if (e.key === 'Enter' && tagName !== 'input' && tagName !== 'textarea' && tagName !== 'select') {
    const btn = document.querySelector('.btn-pr:not(:disabled)');
    if (btn && btn.offsetParent !== null) btn.click();
  }
});

// 1. DASHBOARD DEL SUPERVISOR
// ═══════════════════════════════════════════════════════════
async function pgDashboard() {
  ld('Cargando dashboard...');
  try {
    const [ped, req] = await Promise.all([
      sb.from('pedidos').select('bodega,zona_logistica,estado_prep,cant_comprometida,cant_alistada').eq('co', G.co.id),
      sb.from('requisiciones').select('bodega,estado_prep,cant_comprometida,cant_alistada').eq('co', G.co.id),
    ]);
    const zonas = await sb.from('zonas').select('referencia,bodega_id,zona,co').eq('co', G.co.id);
    uld();
    const todos = [
      ...(Array.isArray(ped)?ped:[]).map(i=>({...i,_tipo:'pedido'})),
      ...(Array.isArray(req)?req:[]).map(i=>({...i,_tipo:'req'})),
    ];
    const total = todos.length;
    const compl = todos.filter(i=>i.estado_prep==='completo').length;
    const parc  = todos.filter(i=>i.estado_prep==='parcial').length;
    const pend  = todos.filter(i=>!i.estado_prep||i.estado_prep==='pendiente').length;
    const pct   = total ? Math.round((compl+parc)/total*100) : 0;

    // Group by zona
    const zonaMap = {};
    (Array.isArray(zonas)?zonas:[]).forEach(z => {
      zonaMap[z.referencia+'|'+z.bodega_id] = z.zona || 'SIN ZONA';
    });
    const byZona = {};
    todos.forEach(it => {
      const z = zonaMap[it.referencia+'|'+it.bodega] || 'SIN ZONA';
      if (!byZona[z]) byZona[z] = {total:0,compl:0,parc:0};
      byZona[z].total++;
      if (it.estado_prep==='completo') byZona[z].compl++;
      else if (it.estado_prep==='parcial') byZona[z].parc++;
    });

    let zonaBars = Object.entries(byZona).sort((a,b)=>b[1].total-a[1].total).map(([zona,info])=>{
      const zp = info.total ? Math.round((info.compl+info.parc)/info.total*100) : 0;
      const col = zp===100?'var(--ok)':zp>50?'var(--gold)':'var(--er)';
      return '<div class="zona-bar">'
        + '<div class="zona-bar-name">' + e(zona) + '</div>'
        + '<div class="zona-bar-bg"><div class="zona-bar-fill" style="width:' + zp + '%;background:' + col + '"></div></div>'
        + '<div class="zona-bar-pct">' + zp + '%</div>'
        + '<div style="font-size:10px;color:var(--mut)">' + (info.compl+info.parc) + '/' + info.total + '</div>'
        + '</div>';
    }).join('');

    // Cant total vs alistada
    const cantTotal  = todos.reduce((s,i)=>s+(parseFloat(i.cant_comprometida)||0),0);
    const cantAlist  = todos.reduce((s,i)=>s+(parseFloat(i.cant_alistada)||0),0);

    const zonasBarsHtml = zonaBars || '<div style="color:var(--mut);font-size:13px">Sin datos de zonas</div>';
    rdr('<div class="hdr">'
      + '<button class="hdr-btn" onclick="pgSupervisor()">← Supervisor</button>'
      + '<h1>📊 Dashboard</h1><span class="hdr-sub">CO ' + G.co.id + '</span></div>'
      + '<div style="padding:10px 14px 4px">'
      + '<div class="prog-bg" style="height:14px"><div class="prog-fill" style="width:' + pct + '%"></div></div>'
      + '<div style="text-align:center;font-size:13px;font-weight:700;margin-top:4px;color:var(--gold)">' + pct + '% completado</div></div>'
      + '<div class="dash-grid">'
      + '<div class="dash-card" style="border-left:4px solid var(--ok)"><div class="dash-title">✅ Completos</div>'
      + '<div class="dash-big" style="color:var(--ok)">' + compl + '</div>'
      + '<div class="dash-sub">' + (total ? Math.round(compl/total*100) : 0) + '% del total</div></div>'
      + '<div class="dash-card" style="border-left:4px solid var(--wa)"><div class="dash-title">⏳ Parciales</div>'
      + '<div class="dash-big" style="color:var(--wa)">' + parc + '</div>'
      + '<div class="dash-sub">' + (total ? Math.round(parc/total*100) : 0) + '% del total</div></div>'
      + '<div class="dash-card" style="border-left:4px solid var(--mut)"><div class="dash-title">⬜ Pendientes</div>'
      + '<div class="dash-big" style="color:var(--mut)">' + pend + '</div>'
      + '<div class="dash-sub">' + (total ? Math.round(pend/total*100) : 0) + '% del total</div></div>'
      + '<div class="dash-card" style="border-left:4px solid var(--gold)"><div class="dash-title">📦 Cantidades</div>'
      + '<div class="dash-big">' + fmtn(Math.round(cantAlist)) + '</div>'
      + '<div class="dash-sub">de ' + fmtn(Math.round(cantTotal)) + ' totales</div></div></div>'
      + '<div class="dash-card-full"><div class="dash-title">📍 Avance por zona</div>' + zonasBarsHtml + '</div>'
      + '<div style="padding:0 14px 12px"><button class="btn btn-pr" style="color:var(--gold)" onclick="pgDashboard()">🔄 Actualizar</button></div>'
    );
  } catch(err) { uld(); toast('Error: '+err.message,'er'); }
}

      <button class="btn btn-pr" style="color:var(--gold)" onclick="pgSupervisionVivo()">🔄 Actualizar</button>
    </div>`);
  } catch(err) {
    uld();
    // Tabla puede no existir aún — mostrar pantalla vacía con instrucción
    rdr(`<div class="hdr">
      <button class="hdr-btn" onclick="pgSupervisor()">← Supervisor</button>
      <h1>👁️ En vivo</h1>
    </div>
    <div class="card" style="text-align:center;color:var(--mut)">
      <div style="font-size:32px;margin-bottom:8px">🔧</div>
      <div style="font-weight:700">Requiere SQL adicional</div>

    </div>`);

}

function calcTiempoDesde(iso) {
  if (!iso) return '—';
  const mins = Math.floor((Date.now() - new Date(iso).getTime()) / 60000);
  if (mins < 60) return mins + ' min';
  return Math.floor(mins/60) + 'h ' + (mins%60) + 'm';
}

// 4. TIMER POR ZONA — registra inicio/fin y guarda en historial
// ═══════════════════════════════════════════════════════════
let _zonaTimer = null;    // { zona, inicio: Date, intervalo }

function iniciarTimerZona(zona) {
  if (_zonaTimer) detenerTimerZona();
  _zonaTimer = { zona, inicio: new Date(), intervalo: null };
  _zonaTimer.intervalo = setInterval(() => {
    const el = document.getElementById('zonaTimerDisplay');
    if (el) el.textContent = '⏱ ' + calcTiempoDesde(_zonaTimer.inicio.toISOString());
  }, 10000); // update every 10s
  // Register en sesiones_activas
  registrarSesionActiva(zona);
}

async function detenerTimerZona() {
  if (!_zonaTimer) return;
  clearInterval(_zonaTimer.intervalo);
  const mins = Math.round((Date.now() - _zonaTimer.inicio.getTime()) / 60000);
  const zona = _zonaTimer.zona;
  _zonaTimer = null;
  // Guardar en historial
  try {
    const items = _alItems.filter(i => (i._zona||'SIN ZONA') === zona);
    const compl = items.filter(i=>i.estado_prep==='completo').length;
    await sb.from('historial_alistamientos').insert([{
      co: G.co.id,
      zona,
      usuario_id: G.user.id,
      usuario_nombre: G.user.nombre,
      fecha_inicio: _zonaTimer?.inicio || new Date().toISOString(),
      fecha_cierre: new Date().toISOString(),
      duracion_minutos: mins,
      total_refs: items.length,
      refs_completas: compl,
      validado_supervisor: false,
    }]);
  } catch(e) { console.warn('historial save:', e.message); }
  // Limpiar sesión activa
  try {
    await sb.from('sesiones_activas').delete().eq('usuario_id', G.user.id);
  } catch(e) {}
}

async function registrarSesionActiva(zona) {
  try {
    await sb.from('sesiones_activas').upsert([{
      usuario_id: G.user.id,
      usuario_nombre: G.user.nombre,
      co: G.co.id,
      zona_actual: zona,
      inicio_sesion: new Date().toISOString(),
      actualizado_en: new Date().toISOString(),
    }], 'usuario_id');
  } catch(e) { console.warn('sesion activa:', e.message); }
}

function abrirBuscador() {
  document.body.insertAdjacentHTML('beforeend', `

      <div class="search-box">
        <div style="display:flex;gap:8px;align-items:center">

          <button class="btn btn-sec btn-sm" onclick="cerrarBuscador()" style="margin:0">✕</button>
        </div>
      </div>

      </div>
    </div>`);
  setTimeout(()=>document.getElementById('buscadorInput')?.focus(), 100);
}

function cerrarBuscador() {
  document.getElementById('buscadorOverlay')?.remove();
}

function buscarReferencia(q) {
  const el = document.getElementById('buscadorResults');
  if (!el) return;
  const query = q.trim().toLowerCase();
  if (query.length < 2) { el.innerHTML = '<div style="text-align:center;padding:24px;color:var(--mut)">Escribe al menos 2 caracteres</div>'; return; }
  const found = _alItems.filter(i =>
    String(i.referencia||'').toLowerCase().includes(query) ||
    String(i.desc_item||'').toLowerCase().includes(query)
  ).slice(0, 20);
  if (!found.length) { el.innerHTML = '<div style="text-align:center;padding:24px;color:var(--mut)">Sin resultados</div>'; return; }
  el.innerHTML = found.map(item => {
    const prep = item.estado_prep || 'pendiente';
    const cls = prep==='completo'?'b-ok':prep==='parcial'?'b-wa':'b-gray';
    const gKey = encodeURIComponent(item.referencia+'|'+item.bodega+'|'+item._tipo+'|'+(item.co||G.co.id));
    return `<div class="search-row" onclick="irAItem('${gKey}','${encodeURIComponent(item._zona||'SIN ZONA')}')">
      <div style="font-size:11px;color:var(--mut)">${e(item.referencia)} · ${e(item.bodega||'')}</div>
      <div style="font-weight:700;font-size:13px">${e(item.desc_item||'—')}</div>

        <span class="badge b-gray">${e(item._zona||'SIN ZONA')}</span>
        <span class="badge ${cls}">${prep}</span>

    </div>`;
  }).join('');
}

function irAItem(gKeyEnc, zonaEnc) {
  cerrarBuscador();

// 6. ESCÁNER DE CÓDIGO DE BARRAS
// ═══════════════════════════════════════════════════════════
let _scanStream = null;

async function abrirEscaner() {
  if (!navigator.mediaDevices?.getUserMedia) {
    toast('Tu dispositivo no soporta cámara', 'er'); return;
  }
  document.body.insertAdjacentHTML('beforeend', `
    <div class="search-overlay" id="scanOverlay" style="display:flex;flex-direction:column;background:#000">
      <div style="padding:14px;display:flex;align-items:center;gap:10px">
        <div style="color:#fff;font-weight:700;flex:1">📷 Escanear código de barras</div>
        <button class="btn btn-sec btn-sm" onclick="cerrarEscaner()">✕ Cerrar</button>
      </div>
      <video id="scanVideo" style="width:100%;max-height:60vh;object-fit:cover" playsinline autoplay></video>
      <div style="padding:14px">
        <div style="color:var(--gold);font-size:13px;text-align:center;margin-bottom:8px">O ingresa el código manualmente:</div>
        <div style="display:flex;gap:8px">
          <input id="scanManual" class="inp" style="flex:1" placeholder="Código de barras / referencia"
            onkeydown="if(event.key==='Enter')procesarCodigoBarras(this.value)"/>
          <button class="btn btn-pr btn-sm" style="color:var(--gold)" onclick="procesarCodigoBarras(document.getElementById('scanManual').value)">Buscar</button>
        </div>
      </div>
    </div>`);
  // Intentar activar cámara
  try {
    _scanStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    const video = document.getElementById('scanVideo');
    if (video) { video.srcObject = _scanStream; video.play(); }
    // Usar BarcodeDetector si disponible
    if ('BarcodeDetector' in window) {
      const detector = new BarcodeDetector({ formats: ['code_128','ean_13','ean_8','code_39','upc_a'] });
      const scan = async () => {
        if (!document.getElementById('scanVideo')) return;
        try {
          const codes = await detector.detect(document.getElementById('scanVideo'));
          if (codes.length > 0) { procesarCodigoBarras(codes[0].rawValue); return; }
        } catch {}
        if (document.getElementById('scanOverlay')) requestAnimationFrame(scan);
      };
      requestAnimationFrame(scan);
    }
  } catch(e) { console.warn('camera:', e.message); }
}

function cerrarEscaner() {
  if (_scanStream) { _scanStream.getTracks().forEach(t=>t.stop()); _scanStream = null; }
  document.getElementById('scanOverlay')?.remove();
}

function procesarCodigoBarras(codigo) {
  cerrarEscaner();
  if (!codigo) return;
  const q = codigo.trim();
  // Buscar por codigo_barra o referencia
  const found = _alItems.filter(i =>
    String(i.referencia||'').toLowerCase() === q.toLowerCase() ||
    (i._items||[]).some(it => String(it.codigo_barra||'') === q)
  );
  if (!found.length) {
    toast('Código no encontrado: ' + q, 'wa'); return;
  }
  if (found.length === 1) {
    const gKey = encodeURIComponent(found[0].referencia+'|'+found[0].bodega+'|'+found[0]._tipo+'|'+(found[0].co||G.co.id));
    _alZona = found[0]._zona || 'SIN ZONA';
    openItemModal(gKey);
  } else {
    // Múltiples coincidencias — mostrar buscador con resultados
    abrirBuscador();
    setTimeout(() => {
      const inp = document.getElementById('buscadorInput');
      if (inp) { inp.value = q; buscarReferencia(q); }
    }, 200);
  }
}

async function validarZona(zona, accion) {
  // accion: 'validar' | 'reiniciar'
  ld(accion==='validar' ? 'Validando...' : 'Reiniciando...');
  try {
    if (accion === 'validar') {
      // Marcar todos los ítems de la zona como validados
      const items = _alItems.filter(i=>(i._zona||'SIN ZONA')===zona);
      for (const group of items) {
        for (const it of group._items||[group]) {
          if (it.estado_prep !== 'completo') continue;
          await sb.from(it._tipo||'pedidos').update({ validado_supervisor: true }).eq('id', it.id);
        }
      }
      // Guardar en historial
      await sb.from('historial_alistamientos').insert([{
        co: G.co.id, zona,
        usuario_nombre: G.user.nombre,
        fecha_cierre: new Date().toISOString(),
        total_refs: items.length,
        refs_completas: items.filter(i=>i.estado_prep==='completo').length,
        validado_supervisor: true,
        validado_por: G.user.nombre,
      }]);
      uld(); toast('✅ Zona validada correctamente');
    } else {
      // Reiniciar todos los ítems de la zona
      const items = _alItems.filter(i=>(i._zona||'SIN ZONA')===zona);
      for (const group of items) {
        for (const it of group._items||[group]) {
          await sb.from(it._tipo||'pedidos').update({ estado_prep:'pendiente', cant_alistada:null, motivo:null }).eq('id', it.id);
          it.estado_prep = 'pendiente'; it.cant_alistada = null; it.motivo = null;
        }
        group.estado_prep = 'pendiente'; group.cant_alistada_total = 0;
      }
      uld(); toast('↩ Zona reiniciada — todos los ítems vuelven a pendiente', 'wa');
    }
    // Recargar datos
    await pgAlistador();
  } catch(err) { uld(); toast('Error: '+err.message,'er'); }
}

function buildSheet(data, cfg) {
  const rows = [cfg.headers];
  (data || []).forEach(r => {
    rows.push(cfg.cols.map(c => {
      const v = r[c];
      if (v === null || v === undefined) return '';
      if (typeof v === 'boolean') return v ? 'TRUE' : 'FALSE';
      return v;
    }));
  });
  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws['!cols'] = cfg.headers.map((h, i) => {
    const maxL = Math.max(h.length, ...(data||[]).slice(0,50).map(r => String(r[cfg.cols[i]]||'').length));
    return { wch: Math.min(maxL + 2, 45) };
  });
  return ws;
}

      if (filtros.prep && filtros.prep !== 'todos') data = data.filter(r => r.estado_prep === filtros.prep);
    } else if (tabla === 'kits' && filtros) {
      if (filtros.ref)  data = data.filter(r => String(r.referencia||'').toLowerCase().includes(filtros.ref.toLowerCase()));

      if (filtros.ciu)  data = data.filter(r => String(r.desc_ciudad||'').toLowerCase().includes(filtros.ciu.toLowerCase()));
      if (filtros.co)   data = data.filter(r => String(r.co||'').includes(filtros.co));
    } else if (tabla === 'usuarios' && filtros) {
      if (filtros.nom)  data = data.filter(r => String(r.nombre||'').toLowerCase().includes(filtros.nom.toLowerCase()));
      if (filtros.co)   data = data.filter(r => String(r.centros_operacion||'').includes(filtros.co));
      if (filtros.per)  data = data.filter(r => String(r.perfiles||'').toLowerCase().includes(filtros.per.toLowerCase()));
    }
  } else {
    ld('Descargando ' + tabla + '...');
    try { data = await sb.from(tabla).select('*'); } catch(err) { uld(); toast('Error: ' + err.message, 'er'); return; }
    uld();
  }
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, buildSheet(Array.isArray(data) ? data : [], cfg), cfg.nombre.substring(0,31));
  const sufijo = usarFiltro ? '_filtrado' : '_completo';
  XLSX.writeFile(wb, cfg.nombre + sufijo + '_' + new Date().toISOString().slice(0,10) + '.xlsx');
  toast('✅ ' + (Array.isArray(data) ? data.length : 0) + ' filas exportadas' + (usarFiltro ? ' (filtrado)' : ''));
}

async function exportTable(tabla) {
  ld('Exportando ' + tabla + '...');
  try {
    const data = await sb.from(tabla).select('*');
    const cfg  = EXPORT_CFGS[tabla];
    const wb   = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, buildSheet(Array.isArray(data) ? data : [], cfg), cfg.nombre.substring(0,31));
    XLSX.writeFile(wb, cfg.nombre + '_' + new Date().toISOString().slice(0,10) + '.xlsx');
    uld(); toast('✅ ' + (Array.isArray(data) ? data.length : 0) + ' filas exportadas');
  } catch(err) { uld(); toast('Error: ' + err.message, 'er'); }
}

async function exportAll() {
  ld('Exportando todas las tablas...');
  try {
    const tablas = ['zonas','kits','usuarios','bodegas','pedidos','requisiciones'];
    const wb = XLSX.utils.book_new();
    let total = 0;
    for (const t of tablas) {
      const data = await sb.from(t).select('*');
      const cfg  = EXPORT_CFGS[t];
      XLSX.utils.book_append_sheet(wb, buildSheet(Array.isArray(data) ? data : [], cfg), cfg.nombre.substring(0,31));
      total += Array.isArray(data) ? data.length : 0;
    }
    XLSX.writeFile(wb, 'Alistamiento_Backup_' + new Date().toISOString().slice(0,10) + '.xlsx');
    uld(); toast('✅ ' + total + ' registros en 6 hojas');
  } catch(err) { uld(); toast('Error: ' + err.message, 'er'); }
}
